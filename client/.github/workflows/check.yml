name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-validation:
    name: Client validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Restore SDL toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ci-prefix
          key: client-sdl-mixer-ubuntu-26.04-x64-3.2.4-v1

      - name: Pull pinned build environment
        run: docker pull ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03

      - name: Validate, build, and test
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03 \
            bash -euo pipefail -c '
              tools/install-linux-ci-dependencies.sh build/ci-prefix
              export CMAKE_PREFIX_PATH=/workspace/build/ci-prefix
              export LD_LIBRARY_PATH=/workspace/build/ci-prefix/lib
              export PKG_CONFIG_PATH=/workspace/build/ci-prefix/lib/pkgconfig
              python3 -m unittest discover -s tools/tests -p "test_*.py"
              python3 tools/dependencies.py sync
              python3 tools/dependencies.py verify
              cmake --preset linux-coverage
              cmake --build --preset linux-coverage --parallel
              ctest --preset linux-coverage
              gcovr --root . --filter "src/" --exclude "src/tests/" \
                --print-summary --xml coverage.xml --html-details coverage.html
            '

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.xml
          use_oidc: true
