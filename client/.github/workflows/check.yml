name: Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: read

jobs:
  client-validation:
    name: Client validation
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/atrinik/linux-build:0.0.3
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and install pinned runtime dependencies
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/dependencies.py sync
          python3 tools/dependencies.py verify

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build and test
        run: |
          cmake --build --preset linux-debug --parallel
          ctest --preset linux-debug

