name: Package Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic-release tag to package
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: package-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: metadata
        name: Validate tag and commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ ${RELEASE_TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_TAG#v}"
          } >>"${GITHUB_OUTPUT}"

  source:
    name: Build source package
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - name: Build deterministic source package
        run: tools/package-release.sh "${{ needs.metadata.outputs.tag }}" build/release
      - uses: actions/upload-artifact@v7
        with:
          name: source-${{ needs.metadata.outputs.tag }}
          path: build/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows client package
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - name: Pull pinned Windows build environment
        run: docker pull ghcr.io/atrinik/windows-build:1.0.0
      - name: Build portable Windows package
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env CCACHE_DIR=/workspace/build/ccache \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ghcr.io/atrinik/windows-build:1.0.0 \
            bash tools/build-windows-package.sh build/packages
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ needs.metadata.outputs.tag }}
          path: build/packages/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release packages
    needs: [metadata, source, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-${{ needs.metadata.outputs.tag }}"
          path: build/release
          merge-multiple: true
      - name: Upload packages and checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 2
          (cd build/release && sha256sum ./* >SHA256SUMS)
          gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}" build/release/SHA256SUMS
