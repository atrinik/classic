name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  library-validation:
    name: Library validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/install"

      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Install package
        run: cmake --install build

      - name: Validate installed consumer
        run: |
          cmake -S tests/consumer -B build/consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer --parallel
          build/consumer/libatrinik-consumer
