name: Tagged Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tagged-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish libatrinik package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ ${RELEASE_TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/master
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Build package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: tools/package-release.sh "${RELEASE_TAG}" build/release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          gh release create "${RELEASE_TAG}" --verify-tag --generate-notes \
            --title "libatrinik ${RELEASE_TAG}" "${assets[@]}"
