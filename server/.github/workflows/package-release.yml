name: Package Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic-release tag to package
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: package-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      latest: ${{ steps.metadata.outputs.latest }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: metadata
        name: Validate tag and commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ ${RELEASE_TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          latest_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "latest=$([[ ${RELEASE_TAG} == "${latest_tag}" ]] && echo true || echo false)"
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_TAG#v}"
          } >>"${GITHUB_OUTPUT}"

  source:
    name: Build source package
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - name: Build deterministic source package
        run: tools/package-release.sh "${{ needs.metadata.outputs.tag }}" build/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-${{ needs.metadata.outputs.tag }}
          path: build/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows server package
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull pinned Windows build environment
        run: docker pull ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7
      - name: Build portable Windows package
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env CCACHE_DIR=/workspace/build/ccache \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7 \
            bash tools/build-windows-package.sh build/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-${{ needs.metadata.outputs.tag }}
          path: build/packages/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release packages
    needs: [metadata, source, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-${{ needs.metadata.outputs.tag }}"
          path: build/release
          merge-multiple: true
      - name: Upload packages and checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 2
          (cd build/release && sha256sum ./* >SHA256SUMS)
          gh release upload "${RELEASE_TAG}" --clobber "${assets[@]}" build/release/SHA256SUMS

  image:
    name: Build and publish server image
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build and publish versioned image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: ATRINIK_PACKAGE_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          context: .
          file: Dockerfile
          labels: |
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Atrinik Server
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          push: true
          tags: ghcr.io/atrinik/atrinik-server:${{ needs.metadata.outputs.version }}
      - name: Update latest image alias
        if: needs.metadata.outputs.latest == 'true'
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/atrinik/atrinik-server:latest
          ghcr.io/atrinik/atrinik-server:${{ needs.metadata.outputs.version }}
