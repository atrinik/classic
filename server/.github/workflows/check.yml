name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-validation:
    name: Server validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pull public build environment
        run: docker pull ghcr.io/atrinik/linux-build:0.0.5

      - name: Validate, build, and test
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ghcr.io/atrinik/linux-build:0.0.5 \
            bash -euo pipefail -c '
              python3 -m unittest discover -s tools/tests -p "test_*.py"
              python3 tools/dependencies.py sync
              python3 tools/dependencies.py verify
              cmake --preset linux-debug
              cmake --build --preset linux-debug --parallel
              ctest --preset linux-debug
            '
