name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-validation:
    name: Server validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates check cmake flex \
            libcurl4-openssl-dev libgd-dev libminiupnpc-dev \
            libreadline-dev libssl-dev libsubunit-dev ninja-build pkgconf \
            python3-dev zlib1g-dev

      - name: Validate, build, and test
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/dependencies.py sync
          python3 tools/dependencies.py verify
          cmake --preset linux-debug
          cmake --build --preset linux-debug --parallel
          ctest --preset linux-debug
