name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-validation:
    name: Server validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Pull pinned build environment
        run: docker pull ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03

      - name: Validate, build, and test
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03 \
            bash -euo pipefail -c '
              apt-get update -qq
              env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -qq --no-install-recommends \
                  build-essential ca-certificates check cmake flex gcovr \
                  libcurl4-openssl-dev libgd-dev libminiupnpc-dev \
                  libreadline-dev libssl-dev libsubunit-dev ninja-build \
                  pkgconf python3-dev zlib1g-dev
              python3 -m unittest discover -s tools/tests -p "test_*.py"
              python3 tools/dependencies.py sync
              python3 tools/dependencies.py verify
              cmake --preset linux-coverage
              cmake --build --preset linux-coverage --parallel
              ctest --preset linux-coverage
              gcovr --root . --filter "src/" --exclude "src/tests/" \
                --print-summary --xml coverage.xml --html-details coverage.html
            '

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: coverage.xml
          use_oidc: true
