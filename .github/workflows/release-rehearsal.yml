name: Release Rehearsal

on:
  workflow_dispatch:
    inputs:
      warp_symbols_only:
        description: Resolve the fixed Windows WARP sample without running a rehearsal
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  packages: read

jobs:
  preflight:
    if: ${{ inputs.warp_symbols_only != true }}
    name: Bind rehearsal to current main
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      revision: ${{ steps.revision.outputs.commit }}
      source_epoch: ${{ steps.revision.outputs.source_epoch }}
      tag: ${{ steps.revision.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: revision
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "${DISPATCH_REF}" = refs/heads/main
          commit=$(git rev-parse HEAD)
          test "${commit}" = "${DISPATCH_SHA}"
          test "${commit}" = "$(git rev-parse refs/remotes/origin/main)"
          {
            echo "commit=${commit}"
            echo "source_epoch=$(git show -s --format=%ct "${commit}")"
            echo "tag=rehearsal-${commit}"
          } >>"${GITHUB_OUTPUT}"

  rehearse:
    if: ${{ inputs.warp_symbols_only != true }}
    needs: preflight
    uses: ./.github/workflows/build-release-candidate.yml
    with:
      rehearsal: true
      revision: ${{ needs.preflight.outputs.revision }}
      source_epoch: ${{ needs.preflight.outputs.source_epoch }}
      tag: ${{ needs.preflight.outputs.tag }}
      version: 0.0.0

  warp-symbols:
    name: Offline WARP symbol qualification
    if: ${{ inputs.warp_symbols_only == true }}
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact diagnostic source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) {
            throw 'Diagnostic checkout identity mismatch'
          }
      - name: Validate pure symbol fixtures
        shell: pwsh
        run: |
          python -B -m unittest discover -s tools/tests -p test_qualify_warp_symbols.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Symbol fixtures failed' }
      - name: Resolve fixed captured RVAs
        shell: pwsh
        run: |
          python -B tools/ci/qualify_warp_symbols.py
          if ($LASTEXITCODE -ne 0) { throw 'Symbol qualification is inconclusive' }
      - name: Retain bounded symbol report only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: warp-symbol-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: warp-symbol-qualification.json
          if-no-files-found: error
          retention-days: 7
