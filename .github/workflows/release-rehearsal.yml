name: Release Rehearsal

on:
  workflow_dispatch:

permissions:
  actions: read
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  rehearse:
    uses: ./.github/workflows/package-release.yml
    with:
      rehearsal: true
      revision: ${{ github.sha }}
      version: 0.0.0
