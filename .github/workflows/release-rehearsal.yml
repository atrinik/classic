name: Release Rehearsal

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  packages: read

jobs:
  preflight:
    name: Bind rehearsal to current main
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      revision: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - id: revision
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "${DISPATCH_REF}" = refs/heads/main
          commit=$(git rev-parse HEAD)
          test "${commit}" = "${DISPATCH_SHA}"
          test "${commit}" = "$(git rev-parse refs/remotes/origin/main)"
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"

  rehearse:
    needs: preflight
    uses: ./.github/workflows/build-release-candidate.yml
    with:
      rehearsal: true
      revision: ${{ needs.preflight.outputs.revision }}
      version: 0.0.0
