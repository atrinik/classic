name: Qualify Server Image

# Trusted branch bootstrap and maintainer dispatch; no publication or aliases.
on:
  push:
    branches: [build/llvm-classic-server-image-qualification]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic-server-image-qualification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify final Classic server container
    if: github.repository == 'atrinik/classic' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: read
      packages: read
    env:
      SOURCE_REVISION: ${{ github.sha }}
      DOCKER_BUILD_SUMMARY: true
      DOCKER_BUILD_RECORD_UPLOAD: true
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind source and compiler input
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"
          test -z "$(git status --porcelain)"
          grep -Fx 'FROM ghcr.io/atrinik/classic-build:1.17.0@sha256:5ec3669614fde5ac77ce63e89b6adc35cd27b0584451b97928147facb22aaec1 AS build' server/Dockerfile
          mkdir -p build/server-image-evidence
          git show -s --format=fuller HEAD > build/server-image-evidence/source.txt
          docker version > build/server-image-evidence/docker-version.txt
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Acquire and verify durable dependency inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/install_dependency_bundle.sh
      - id: inputs
        name: Record locked input labels
        run: >-
          python3 tools/release/locked_inputs.py --version 0.0.0
          --component server --github-output "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: image
        name: Build and load the actual final server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: |
            ATRINIK_PACKAGE_VERSION=0.0.0
            ATRINIK_SOURCE_REVISION=${{ github.sha }}
            ATRINIK_SOURCE_DIRTY=false
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/atrinik/classic
            org.opencontainers.image.version=0.0.0
            ${{ steps.inputs.outputs.labels }}
          load: true
          push: false
          # Docker's local image store does not retain OCI attestations. This
          # run keeps build records and runtime evidence, not release provenance.
          provenance: false
          sbom: false
          tags: classic-server-qualification:${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain build identity
        env:
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_METADATA: ${{ steps.image.outputs.metadata }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('build/server-image-evidence/build.json').write_text(json.dumps({
              'source_revision': os.environ['SOURCE_REVISION'],
              'image_id': os.environ['IMAGE_ID'], 'digest': os.environ['IMAGE_DIGEST'],
              'metadata': json.loads(os.environ['BUILD_METADATA']),
          }, indent=2) + '\n')
          PY
      - name: Qualify final image behavior and lifecycle
        env:
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
        run: >-
          python3 tools/ci/qualify_server_image.py --image-id "${IMAGE_ID}"
          --revision "${SOURCE_REVISION}" --output build/server-image-evidence/runtime
      - name: Retain bounded qualification evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: server-image-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/server-image-evidence/
          if-no-files-found: error
          retention-days: 14
