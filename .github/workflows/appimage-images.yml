name: Publish AppImage Images

# Prebuild the AppImage builder and clean runtime images once per exact
# prepared context, so releases pull verified digests instead of rebuilding
# every image from the slow pinned snapshot mirrors.
on:
  push:
    branches: [main]
    paths:
      - tools/ci/appimage/**
      - tools/release/resolve_compiler_image.py
      - .github/workflows/appimage-images.yml
      - .github/workflows/build-release-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic-appimage-image-publication
  cancel-in-progress: false

env:
  # Must equal the pin in build-release-candidate.yml so release and
  # publisher prepare identical contexts; a contract test enforces this.
  CLASSIC_LINUX_IMAGE: ghcr.io/atrinik/classic-build:1.18.0@sha256:86d3c4182dc786db8ace56d9d8dc57ff4f14c1c4f517b728547626f576280449
  APPIMAGE_IMAGE_REPOSITORY: ghcr.io/atrinik/classic-appimage

jobs:
  publish:
    name: Publish ${{ matrix.target }} AppImage image
    if: github.repository == 'atrinik/classic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [build, smoke-ubuntu24, smoke-ubuntu26, smoke-debian13, graphical]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: context
        name: Prepare the exact release build context
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p build/appimage-publication
          source_lock_path=$(mktemp "${RUNNER_TEMP}/classic-source-packaging-lock.XXXXXX")
          trap 'rm -f "${source_lock_path}"' EXIT
          compiler_image=$(python3 tools/release/resolve_compiler_image.py \
            --source-root "${GITHUB_WORKSPACE}" --revision "${SOURCE_REVISION}" \
            --current-image "${CLASSIC_LINUX_IMAGE}" --source-packaging-lock-output "${source_lock_path}")
          compiler_arguments=()
          if test -s "${source_lock_path}"; then
            compiler_arguments=(--source-packaging-lock "${source_lock_path}")
          fi
          python3 tools/ci/appimage/prepare.py --output build/appimage-context \
            --compiler-image "${compiler_image}" "${compiler_arguments[@]}" \
            > build/appimage-publication/prepare.log 2>&1
          context_key=$(python3 tools/ci/appimage/context_key.py --context build/appimage-context \
            --graphical-dockerfile tools/ci/appimage/graphical.Dockerfile)
          {
            echo "compiler_image=${compiler_image}"
            echo "context_key=${context_key}"
            echo "reference=${APPIMAGE_IMAGE_REPOSITORY}:${MATRIX_TARGET}-${context_key}"
          } >> "${GITHUB_OUTPUT}"
        shell: bash
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: existing
        name: Reuse an already published image for this context
        env:
          REFERENCE: ${{ steps.context.outputs.reference }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if digest=$(docker buildx imagetools inspect "${REFERENCE}" --format '{{.Manifest.Digest}}' 2> /dev/null) &&
              [[ ${digest} =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
            # A run that pushed but failed to attest leaves an unattested tag;
            # attest that exact digest instead of skipping it forever.
            if gh attestation verify "oci://${APPIMAGE_IMAGE_REPOSITORY}@${digest}" --repo atrinik/classic \
                --signer-workflow atrinik/classic/.github/workflows/appimage-images.yml \
                --source-ref refs/heads/main > /dev/null 2>&1; then
              echo "attested=true" >> "${GITHUB_OUTPUT}"
            else
              echo "attested=false" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "attested=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.existing.outputs.exists == 'false'
      - id: image
        name: Build and push the image
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: build/appimage-context
          file: ${{ matrix.target == 'graphical' && 'tools/ci/appimage/graphical.Dockerfile' || 'build/appimage-context/Dockerfile' }}
          target: ${{ matrix.target != 'graphical' && matrix.target || '' }}
          build-args: |
            ATRINIK_COMPILER_IMAGE=${{ steps.context.outputs.compiler_image }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.context.outputs.reference }}
      - name: Attest the published image
        if: steps.existing.outputs.attested != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.APPIMAGE_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
          push-to-registry: true
      - name: Record the published image
        env:
          REFERENCE: ${{ steps.context.outputs.reference }}
          DIGEST: ${{ steps.image.outputs.digest || steps.existing.outputs.digest }}
          EXISTS: ${{ steps.existing.outputs.exists }}
        run: |
          {
            echo "### ${MATRIX_TARGET} AppImage image"
            echo "Reference: ${REFERENCE}"
            echo "Digest: ${DIGEST}"
            if test "${EXISTS}" = true; then
              echo 'Already published for this exact context.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
    env:
      MATRIX_TARGET: ${{ matrix.target }}
