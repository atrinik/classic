name: GPU renderer qualification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic-gpu-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  CLASSIC_LINUX_IMAGE: ghcr.io/atrinik/classic-build:1.16.0@sha256:e1c366dbf83ef987765ff913bbb193868314a139ae1e00cc134b22a3159464f2
  CLASSIC_LINUX_RUNTIME_IMAGE: ghcr.io/atrinik/linux-build:1.16.0@sha256:89fae13a18407d2341aea4199ab0d44ab319efb8138cb95da1b221e6748faa7e
  CLASSIC_WINDOWS_IMAGE: ghcr.io/atrinik/windows-build:1.16.0@sha256:4266256d4b4196241df6463e687dd286022e24e3bc46dfafb4f877744a731d69

jobs:
  shaders:
    name: Build qualification shader cohort
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gpu-shader-downloads
          key: >-
            gpu-shader-inputs-v1-${{ hashFiles('client/shaders/toolchain.lock.json',
            'client/tools/prepare_gpu_shader_toolchain.py') }}
      - name: Compile and validate the qualification shader cohort
        run: >-
          tools/ci/prepare_gpu_shaders.sh
          "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/gpu-shader-downloads"
          "${GITHUB_WORKSPACE}/build/gpu-shaders"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualification-gpu-shaders
          path: build/gpu-shaders
          if-no-files-found: error
          retention-days: 1

  windows-bundle:
    name: Build matching Windows qualification bundle
    needs: shaders
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind clean source and acquire locked client inputs
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --short)"
          python3 client/tools/dependencies.py sync --root client --refresh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualification-gpu-shaders
          path: build/gpu-shaders
      - name: Pull pinned LLVM Windows producer anonymously
        run: docker pull "${CLASSIC_WINDOWS_IMAGE}"
      - name: Cross-build and stage the exact qualification runtime
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/classic-home \
            --env ATRINIK_WINDOWS_TOOLCHAIN_FILE=/opt/atrinik-windows/share/cmake/llvm-mingw.cmake \
            --env ATRINIK_WINDOWS_TARGET=x86_64-w64-mingw32 \
            --env ATRINIK_WINDOWS_RUNTIME_DIR=/opt/atrinik-windows/bin \
            --env PATH=/opt/llvm-mingw/bin:/opt/atrinik-windows/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env ATRINIK_BENCHMARK_REVISION="${GITHUB_SHA}" \
            --env ATRINIK_BENCHMARK_DIRTY=false \
            --volume "${GITHUB_WORKSPACE}:/workspace" --workdir /workspace \
            "${CLASSIC_WINDOWS_IMAGE}" bash -c '
              set -euo pipefail
              cmake -S client -B client/build/gpu-qualification -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="${ATRINIK_WINDOWS_TOOLCHAIN_FILE}" \
                -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
                -DATRINIK_GPU_CONFORMANCE_REQUIRED=ON -DPACKAGE_TYPE=none \
                -DATRINIK_GPU_SHADER_DIRECTORY=/workspace/build/gpu-shaders
              cmake --build client/build/gpu-qualification --config Release \
                --target atrinik client-gpu-renderer-integration-tests --parallel "$(nproc)"
              python3 tools/ci/stage_windows_runtime.py \
                --readobj llvm-readobj --runtime-dir "${ATRINIK_WINDOWS_RUNTIME_DIR}" \
                --output-dir build/windows-gpu-qualification \
                client/build/gpu-qualification/atrinik.exe \
                client/build/gpu-qualification/client-gpu-renderer-integration-tests.exe
              cmake -E copy_directory client/sound build/windows-gpu-qualification/sound
              printf "%s\n" "${ATRINIK_BENCHMARK_REVISION}" \
                > build/windows-gpu-qualification/source-revision
              clang --version > build/windows-gpu-qualification/compiler.txt
              sha256sum build/gpu-shaders/SHA256SUMS \
                > build/windows-gpu-qualification/shader-manifest.sha256
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-gpu-qualification-${{ github.sha }}
          path: build/windows-gpu-qualification
          if-no-files-found: error
          retention-days: 1

  qualify:
    name: ${{ matrix.backend }} / ${{ matrix.hardware }}
    needs: [shaders, windows-bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: vulkan
            hardware: reference
            runner: '["self-hosted","gpu-qualification","linux","reference"]'
          - backend: vulkan
            hardware: minimum
            runner: '["self-hosted","gpu-qualification","linux","minimum"]'
          - backend: direct3d12
            hardware: reference
            runner: '["self-hosted","gpu-qualification","windows","reference"]'
          - backend: direct3d12
            hardware: minimum
            runner: '["self-hosted","gpu-qualification","windows","minimum"]'
          - backend: metal
            hardware: reference
            runner: '["self-hosted","gpu-qualification","macos","reference"]'
          - backend: metal
            hardware: minimum
            runner: '["self-hosted","gpu-qualification","macos","minimum"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qualification-gpu-shaders
          path: build/gpu-shaders
      - name: Bind qualification source identity
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse --verify HEAD)
          test "${#revision}" -eq 40
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          echo "ATRINIK_BENCHMARK_REVISION=${revision}" >>"${GITHUB_ENV}"
          echo "ATRINIK_BENCHMARK_DIRTY=false" >>"${GITHUB_ENV}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: runner.os == 'Windows'
        with:
          name: windows-gpu-qualification-${{ github.sha }}
          path: client/build/gpu-qualification
      - name: Verify exact Windows qualification bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          test "$(cat client/build/gpu-qualification/source-revision)" = "${GITHUB_SHA}"
          grep -F 'clang version 23.1.3' client/build/gpu-qualification/compiler.txt
          sha256sum --check client/build/gpu-qualification/shader-manifest.sha256
          cmake -E copy_directory client/build/gpu-qualification/sound client/sound
      - name: Prepare and verify pinned native macOS LLVM
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tools/ci/prepare_macos_llvm.sh "${RUNNER_TEMP}/classic-llvm-macos"
          echo "${RUNNER_TEMP}/classic-llvm-macos/llvm/bin" >>"${GITHUB_PATH}"
      - name: Configure clean Release qualification build
        if: runner.os != 'Windows'
        shell: bash
        env:
          ATRINIK_QUALIFICATION_SHADER_DIRECTORY: ${{ github.workspace }}/build/gpu-shaders
        run: |
          set -euo pipefail
          if test "${RUNNER_OS}" = Linux; then
            python3 tools/ci/run_gpu_qualification.py \
              --source-root "${GITHUB_WORKSPACE}" --check-runtime
            python3 client/tools/dependencies.py sync --root client --refresh
            docker pull "${CLASSIC_LINUX_IMAGE}"
            docker pull "${CLASSIC_LINUX_RUNTIME_IMAGE}"
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/classic-home \
              --env ATRINIK_BENCHMARK_REVISION --env ATRINIK_BENCHMARK_DIRTY \
              --volume "${GITHUB_WORKSPACE}:/workspace" --workdir /workspace \
              "${CLASSIC_LINUX_IMAGE}" bash -c '
                set -euo pipefail
                cmake -S client -B client/build/gpu-qualification -G Ninja \
                  -DCMAKE_TOOLCHAIN_FILE=/workspace/cmake/toolchains/llvm.cmake \
                  -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
                  -DATRINIK_GPU_CONFORMANCE_REQUIRED=ON -DPACKAGE_TYPE=none \
                  -DATRINIK_GPU_SHADER_DIRECTORY=/workspace/build/gpu-shaders
                cmake --build client/build/gpu-qualification --config Release \
                  --target atrinik client-gpu-renderer-integration-tests --parallel "$(nproc)"
              '
          else
            cmake -S client -B client/build/gpu-qualification -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/llvm-macos.cmake" \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
              -DATRINIK_GPU_CONFORMANCE_REQUIRED=ON -DPACKAGE_TYPE=none \
              "-DATRINIK_GPU_SHADER_DIRECTORY=${ATRINIK_QUALIFICATION_SHADER_DIRECTORY}"
          fi
      - name: Build production client and GPU harness
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          cmake --build client/build/gpu-qualification --config Release
          --target atrinik client-gpu-renderer-integration-tests
      - name: Verify frozen GPU fixture provenance
        run: python3 client/tools/verify_gpu_fixture_provenance.py
      - name: Run GPU integration and conformance checks
        shell: bash
        env:
          ATRINIK_GPU_CONFORMANCE_DRIVER: ${{ matrix.backend }}
          ATRINIK_GPU_CONFORMANCE_HARDWARE_TIER: ${{ matrix.hardware }}
          ATRINIK_GPU_CONFORMANCE_QUALIFIED_HARDWARE: "1"
        working-directory: client
        run: |
          executable=(build/gpu-qualification/client-gpu-renderer-integration-tests)
          if test "${RUNNER_OS}" = Windows; then
            executable=(build/gpu-qualification/client-gpu-renderer-integration-tests.exe)
          elif test "${RUNNER_OS}" = Linux; then
            executable=(python3 ../tools/ci/run_gpu_qualification.py
              --source-root "${GITHUB_WORKSPACE}" -- client-gpu-renderer-integration-tests)
          fi
          "${executable[@]}"
      - name: Run three fresh processes for every stress row
        shell: bash
        env:
          ATRINIK_GPU_CONFORMANCE_DRIVER: ${{ matrix.backend }}
          ATRINIK_GPU_CONFORMANCE_HARDWARE_TIER: ${{ matrix.hardware }}
          ATRINIK_GPU_CONFORMANCE_QUALIFIED_HARDWARE: "1"
        working-directory: client
        run: |
          executable=(build/gpu-qualification/atrinik)
          if test "${RUNNER_OS}" = Windows; then
            executable=(build/gpu-qualification/atrinik.exe)
          elif test "${RUNNER_OS}" = Linux; then
            executable=(python3 ../tools/ci/run_gpu_qualification.py
              --source-root "${GITHUB_WORKSPACE}" -- atrinik)
          fi
          mkdir -p ../build/gpu-qualification
          for workload in \
            dense-17x17-five-depth-1080p \
            dense-25x25-seven-depth-1440p \
            wire-ceiling-28x28-thirteen-depth-1440p \
            wire-ceiling-28x28-thirteen-depth-4k \
            actor-door-roof-animation-25x25; do
            case "${workload}" in
              dense-17x17-five-depth-1080p)
                fixture=gpu-benchmark-dense-17x17-five-depth-1080p ;;
              dense-25x25-seven-depth-1440p)
                fixture=gpu-qualification-town-25x25 ;;
              wire-ceiling-28x28-thirteen-depth-1440p)
                fixture=gpu-benchmark-wire-ceiling-28x28-thirteen-depth-1440p ;;
              wire-ceiling-28x28-thirteen-depth-4k)
                fixture=gpu-benchmark-wire-ceiling-28x28-thirteen-depth-4k ;;
              actor-door-roof-animation-25x25)
                fixture=gpu-benchmark-actor-door-roof-animation-25x25 ;;
            esac
            for run in 1 2 3; do
              output="../build/gpu-qualification/${workload}-${run}.jsonl"
              ATRINIK_GPU_CONFORMANCE_OUTPUT="${output}" \
                "${executable[@]}" --gpu-player-view-benchmark \
                  "src/tests/fixtures/player_view/${fixture}.xml" "${workload}"
            done
          done
      - name: Validate complete qualification contract
        shell: bash
        run: >-
          python3 client/tools/verify_gpu_qualification.py --require-complete
          build/gpu-qualification/*.jsonl
      - name: Run bounded production recovery lifecycle
        shell: bash
        env:
          ATRINIK_GPU_CONFORMANCE_DRIVER: ${{ matrix.backend }}
          ATRINIK_GPU_CONFORMANCE_HARDWARE_TIER: ${{ matrix.hardware }}
          ATRINIK_GPU_CONFORMANCE_QUALIFIED_HARDWARE: "1"
          ATRINIK_GPU_CONFORMANCE_LIFECYCLE_OUTPUT: ../build/gpu-qualification/lifecycle.jsonl
          ATRINIK_GPU_CONFORMANCE_REVIEW_DIRECTORY: ../build/gpu-qualification/review
        working-directory: client
        run: |
          executable=(build/gpu-qualification/atrinik)
          if test "${RUNNER_OS}" = Windows; then
            executable=(build/gpu-qualification/atrinik.exe)
          elif test "${RUNNER_OS}" = Linux; then
            executable=(python3 ../tools/ci/run_gpu_qualification.py
              --source-root "${GITHUB_WORKSPACE}" -- atrinik)
          fi
          "${executable[@]}" --gpu-player-view-lifecycle \
            src/tests/fixtures/player_view/brynknot-movement.xml
      - name: Validate bounded recovery artifact collection
        shell: bash
        run: >-
          python3 client/tools/verify_gpu_qualification.py --collect-lifecycle
          build/gpu-qualification/lifecycle.jsonl
      - name: Run frozen production MAP/MAP2 checkpoints
        shell: bash
        env:
          ATRINIK_GPU_CONFORMANCE_DRIVER: ${{ matrix.backend }}
          ATRINIK_GPU_CONFORMANCE_HARDWARE_TIER: ${{ matrix.hardware }}
          ATRINIK_GPU_CONFORMANCE_QUALIFIED_HARDWARE: "1"
          ATRINIK_GPU_CONFORMANCE_REVIEW_DIRECTORY: ../build/gpu-qualification/review
        working-directory: client
        run: |
          executable=(build/gpu-qualification/atrinik)
          if test "${RUNNER_OS}" = Windows; then
            executable=(build/gpu-qualification/atrinik.exe)
          elif test "${RUNNER_OS}" = Linux; then
            executable=(python3 ../tools/ci/run_gpu_qualification.py
              --source-root "${GITHUB_WORKSPACE}" -- atrinik)
          fi
          for fixture in smooth radial-light-smooth exit-cues \
            living-outline-translucent living-outline-retained-fow timed-light \
            map-overlay-linked-depth map-overlay-widget-state map-overlay-elevated \
            visibility-fade-centered brynknot-movement \
            gpu-qualification-town-25x25 gpu-ui-closure; do
            "${executable[@]}" --gpu-player-view \
              "src/tests/fixtures/player_view/${fixture}.xml" \
              >>"../build/gpu-qualification/production-fixtures.jsonl"
          done
      - name: Validate exact production fixture collection
        shell: bash
        run: >-
          python3 client/tools/verify_gpu_qualification.py --collect-production-fixtures
          build/gpu-qualification/production-fixtures.jsonl
      - name: Enforce human-approved lifecycle goldens
        shell: bash
        run: >-
          python3 client/tools/verify_gpu_qualification.py --lifecycle
          build/gpu-qualification/lifecycle.jsonl
      - name: Enforce human-approved backend goldens
        shell: bash
        run: >-
          python3 client/tools/verify_gpu_qualification.py --production-fixtures
          build/gpu-qualification/production-fixtures.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: gpu-qualification-${{ matrix.backend }}-${{ matrix.hardware }}
          path: |
            build/gpu-qualification/*.jsonl
            build/gpu-qualification/review/*.png
          if-no-files-found: error
          retention-days: 30
