name: Build Release Candidate

on:
  workflow_call:
    inputs:
      rehearsal:
        description: Build and validate without publishing
        default: true
        required: false
        type: boolean
      revision:
        description: Exact preflight-validated candidate commit
        default: ""
        required: false
        type: string
      source_epoch:
        description: Exact preflight-validated candidate source epoch
        default: ""
        required: false
        type: string
      tag:
        description: Existing unified semantic-release tag to package
        default: ""
        required: false
        type: string
      version:
        description: Non-production semantic version used in rehearsal artifacts
        default: 0.0.0
        required: false
        type: string
    outputs:
      commit:
        description: Exact candidate commit
        value: ${{ jobs.metadata.outputs.commit }}
      source_epoch:
        description: Candidate source epoch
        value: ${{ jobs.metadata.outputs.source_epoch }}
      tag:
        description: Candidate artifact namespace
        value: ${{ jobs.metadata.outputs.tag }}
      version:
        description: Candidate semantic version
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  packages: read

env:
  CLASSIC_LINUX_IMAGE: ghcr.io/atrinik/classic-build:1.18.0@sha256:86d3c4182dc786db8ace56d9d8dc57ff4f14c1c4f517b728547626f576280449
  WINDOWS_BUILD_CACHE_EPOCH: llvm-23.1.3-4af130578df18a1944880cd279c7f23afe9cc668-01065f081cdf843a6591abf25f2b27734103ab385c5aa003b2eeb9a3a1ca0e5a

concurrency:
  group: >-
    classic-release-candidate-${{ inputs.tag || inputs.revision || github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Bind preflight-validated candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      source_epoch: ${{ steps.metadata.outputs.source_epoch }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      artifact_schema: ${{ steps.metadata.outputs.artifact_schema }}
      compiler_image: ${{ steps.metadata.outputs.compiler_image }}
      source_packaging_lock: ${{ steps.metadata.outputs.source_packaging_lock }}
      windows_image: ${{ steps.metadata.outputs.windows_image }}
      windows_mode: ${{ steps.metadata.outputs.windows_mode }}
      windows_cache_epoch: ${{ steps.metadata.outputs.windows_cache_epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision }}
      - name: Check out the trusted artifact-contract reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build/release-automation
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/release
      - id: metadata
        name: Validate immutable candidate coordinates
        env:
          RELEASE_COMMIT: ${{ inputs.revision }}
          RELEASE_REHEARSAL: ${{ inputs.rehearsal }}
          RELEASE_SOURCE_EPOCH: ${{ inputs.source_epoch }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          commit=$(git rev-parse "${RELEASE_COMMIT}^{commit}")
          test "${commit}" = "$(git rev-parse HEAD)"
          source_epoch=$(git show -s --format=%ct "${commit}")
          if test -n "${RELEASE_SOURCE_EPOCH}"; then
            test "${source_epoch}" = "${RELEASE_SOURCE_EPOCH}"
          fi
          [[ ${RELEASE_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if test "${RELEASE_REHEARSAL}" = true; then
            test "${RELEASE_TAG}" = "rehearsal-${commit}"
          else
            test "${RELEASE_TAG}" = "v${RELEASE_VERSION}"
            test -n "${RELEASE_SOURCE_EPOCH}"
          fi
          artifact_schema=$(python3 build/release-automation/tools/release/release_artifacts.py \
            --print-source-schema --revision "${commit}" --source-root "${GITHUB_WORKSPACE}")
          [[ ${artifact_schema} == 1 || ${artifact_schema} == 2 || ${artifact_schema} == 3 ]]
          source_packaging_lock=$(mktemp "${RUNNER_TEMP}/classic-source-packaging-lock.XXXXXX")
          compiler_image=$(python3 build/release-automation/tools/release/resolve_compiler_image.py \
            --source-root "${GITHUB_WORKSPACE}" --revision "${commit}" \
            --current-image "${CLASSIC_LINUX_IMAGE}" \
            --source-packaging-lock-output "${source_packaging_lock}")
          python3 build/release-automation/tools/release/windows_producer.py \
            --source-root "${GITHUB_WORKSPACE}" --revision "${commit}" \
            --github-output "${GITHUB_OUTPUT}"
          {
            echo "artifact_schema=${artifact_schema}"
            echo "compiler_image=${compiler_image}"
            # Exact tagged lock bytes, so the token-holding image verifier
            # never needs a candidate checkout of its own. Compressed so the
            # value stays well under the kernel's 128 KiB limit for one
            # environment string.
            echo "source_packaging_lock=$(gzip -9n < "${source_packaging_lock}" | base64 -w0)"
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
            echo "commit=${commit}"
            echo "source_epoch=${source_epoch}"
          } >>"${GITHUB_OUTPUT}"

  dependencies:
    name: Verify durable dependency bundle
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull, verify, and install the exact durable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/install_dependency_bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: |
            client/build/dependencies/downloads/*.tar.gz
            server/build/dependencies/downloads/*.tar.gz
            server/build/dependency-cache/downloads/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  gpu-shaders:
    name: Build release GPU shader cohort
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gpu-shader-downloads
          key: >-
            gpu-shader-inputs-v1-${{ hashFiles('client/shaders/toolchain.lock.json',
            'client/tools/prepare_gpu_shader_toolchain.py') }}
      - name: Compile and validate the locked release shader cohort
        run: >-
          tools/ci/prepare_gpu_shaders.sh
          "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/gpu-shader-downloads"
          "${GITHUB_WORKSPACE}/build/gpu-shaders"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
          if-no-files-found: error
          retention-days: 1

  sources:
    name: Build source packages and protocol wheel
    env:
      CLASSIC_LINUX_IMAGE: ${{ needs.metadata.outputs.compiler_image }}
    permissions:
      contents: read
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: >-
          python3 tools/release/package_sources.py
          --version '${{ needs.metadata.outputs.version }}'
          --revision '${{ needs.metadata.outputs.commit }}'
          --output build/release
      - name: Build wheel from the scoped source package
        run: |
          python3 -m pip install build==1.3.0
          python3 tools/release/build_protocol_wheel.py \
            --version '${{ needs.metadata.outputs.version }}' \
            --source 'build/release/atrinik-classic-protocol-${{ needs.metadata.outputs.version }}.tar.gz' \
            --source-epoch '${{ needs.metadata.outputs.source_epoch }}' \
            --output build/release
      - name: Install and import the wheel without dependencies
        run: |
          python3 -m venv build/wheel-smoke
          build/wheel-smoke/bin/python -m pip install --no-deps \
            build/release/atrinik_classic_protocol-*-py3-none-any.whl
          build/wheel-smoke/bin/python -c \
            'import atrinik_protocol; assert atrinik_protocol.PROTOCOL_VERSION > 0'
      - name: Pull the immutable installed-library toolchain anonymously
        run: docker pull "${CLASSIC_LINUX_IMAGE}"
      - name: Build the extracted unified library and exact-version consumer
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
        run: |
          bash tools/ci/check_installed_library.sh \
            "${CLASSIC_LINUX_IMAGE}" \
            "build/release/atrinik-classic-libatrinik-${RELEASE_VERSION}.tar.gz" \
            "${RELEASE_VERSION}" "${RELEASE_REVISION}" \
            "build/installed-library-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source-protocol-${{ needs.metadata.outputs.tag }}
          path: |
            build/release/*.tar.gz
            build/release/*.whl
          if-no-files-found: error
          retention-days: 30

  client-linux:
    name: Build and install Debian client package
    needs: [metadata, dependencies, gpu-shaders]
    if: needs.metadata.outputs.artifact_schema == '2'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Image preparation and runtime smoke belong to the trusted caller.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Check out candidate source as container input only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          path: candidate-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: build/linux-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
      - name: Retrieve release-only Discord configuration
        if: inputs.rehearsal != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: discord-application-id-${{ inputs.tag }}
          path: build/discord-config
      - name: Prepare pinned Debian testing build and clean runtime
        env:
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
        run: |
          debian_producer=$(python3 tools/ci/debian-client/historical_producer.py \
            --source-root "${GITHUB_WORKSPACE}/candidate-source" --revision "${RELEASE_REVISION}")
          docker build --platform linux/amd64 --target build --tag classic-deb-build \
            --file "${debian_producer}" tools/ci/debian-client
          docker build --platform linux/amd64 --target runtime --tag classic-deb-runtime \
            --file "${debian_producer}" tools/ci/debian-client
          mkdir -p build/linux-package-evidence build/linux-packages build/discord-config
          docker image inspect classic-deb-build classic-deb-runtime \
            --format '{{.Id}}' > build/linux-package-evidence/images.txt
          docker run --rm --network none classic-deb-build cat /build-packages.tsv \
            > build/linux-package-evidence/build-packages.tsv
      - name: Build client with distribution libraries and offline release inputs
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_epoch }}
          DISCORD_CONFIG_FILE: ${{ inputs.rehearsal != true && '/input/discord-config/discord-application-id' || '' }}
        run: |
          docker run --rm --platform linux/amd64 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --cpus 2 --memory 8g \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --env ATRINIK_GPU_SHADER_DIRECTORY=/input/gpu-shaders \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/input/dependencies/client/build/dependencies/downloads \
            --env ATRINIK_DISCORD_APPLICATION_ID_FILE="${DISCORD_CONFIG_FILE}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/candidate-source,target=/input/source,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-inputs,target=/input/dependencies,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/gpu-shaders,target=/input/gpu-shaders,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/discord-config,target=/input/discord-config,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-packages,target=/output" \
            classic-deb-build bash -c \
              'set -euo pipefail
               mkdir /tmp/source
               cp -a --no-preserve=ownership /input/source/. /tmp/source/
               cd /tmp/source/client
               test -f tools/tests/test_linux_package_contract.py
               python3 -m unittest discover -s tools/tests -p test_linux_package_contract.py
               bash tools/build-linux-package.sh /output' \
            > build/linux-package-evidence/build.log 2>&1
          # Candidate code cannot modify the runner checkout, automation, or
          # evidence. Reject symlink outputs before any host consumer opens one.
          package="build/linux-packages/atrinik-classic-client-${RELEASE_VERSION}-linux-amd64.deb"
          test -f "${package}" && test ! -L "${package}"
      - name: Install through APT without build tools or source checkouts
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm --platform linux/amd64 --security-opt no-new-privileges \
            --cpus 2 --memory 4g --env ATRINIK_DEB_SMOKE_CONTAINER=1 \
            --env DEBIAN_FRONTEND=noninteractive \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-packages,target=/packages,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tools/ci/smoke_linux_client_package.sh,target=/smoke.sh,readonly" \
            classic-deb-runtime bash /smoke.sh \
            "/packages/atrinik-classic-client-${RELEASE_VERSION}-linux-amd64.deb" \
            "${RELEASE_VERSION}" > build/linux-package-evidence/install.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-client-linux-${{ needs.metadata.outputs.tag }}
          path: build/linux-packages/atrinik-classic-client-${{ needs.metadata.outputs.version }}-linux-amd64.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain package build and installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-linux-evidence-${{ needs.metadata.outputs.tag }}
          path: build/linux-package-evidence
          if-no-files-found: warn
          retention-days: 30

  client-appimage:
    name: Build and smoke Ubuntu-baseline AppImage
    env:
      CLASSIC_LINUX_IMAGE: ${{ needs.metadata.outputs.compiler_image }}
    # The runner retains Actions service/cache authority; candidate code must
    # never inherit it. Trusted caller scripts build/inspect on the host, while
    # candidate scripts and payloads execute only in offline, unprivileged
    # containers with explicit environment allowlists and bounded mounts.
    # No runner home, socket, service token, or cache enters those containers.
    needs: [metadata, dependencies, gpu-shaders, appimage-prebuilt]
    # The prebuilt-image verifier is advisory: run whatever its result, and
    # build locally when it produced no verified digests.
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' &&
      needs.dependencies.result == 'success' && needs.gpu-shaders.result == 'success' &&
      needs.metadata.outputs.artifact_schema == '3' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Image preparation and runtime smoke belong to the trusted caller.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/ci/appimage
            tools/release
      - name: Check out candidate source as container input only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          path: candidate-source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: build/linux-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
      - name: Retrieve release-only Discord configuration
        if: inputs.rehearsal != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: discord-application-id-${{ inputs.tag }}
          path: build/discord-config
      - name: Prepare pinned Ubuntu builder and clean runtime images
        env:
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
          APPIMAGE_IMAGE_REPOSITORY: ghcr.io/atrinik/classic-appimage
          # Content digests whose main-branch provenance the token-holding
          # verifier job already checked for exactly this prepared context.
          PREBUILT_CONTEXT_KEY: ${{ needs.appimage-prebuilt.outputs.context_key }}
          PREBUILT_IMAGES: ${{ needs.appimage-prebuilt.outputs.images }}
        run: |
          mkdir -p build/appimage-evidence build/appimage-packages build/discord-config
          source_lock_path=$(mktemp "${RUNNER_TEMP}/classic-source-packaging-lock.XXXXXX")
          trap 'rm -f "${source_lock_path}"' EXIT
          python3 tools/release/resolve_compiler_image.py \
            --source-root "${GITHUB_WORKSPACE}/candidate-source" --revision "${RELEASE_REVISION}" \
            --current-image "${CLASSIC_LINUX_IMAGE}" --source-packaging-lock-output "${source_lock_path}" \
            > build/appimage-evidence/compiler-image.txt
          compiler_arguments=()
          if test -s "${source_lock_path}"; then
            compiler_arguments=(--source-packaging-lock "${source_lock_path}")
          fi
          python3 tools/ci/appimage/prepare.py --output build/appimage-context \
            --compiler-image "${CLASSIC_LINUX_IMAGE}" "${compiler_arguments[@]}" \
            > build/appimage-evidence/prepare.log 2>&1
          cp build/appimage-context/packaging.lock.json build/appimage-evidence/
          # Reuse the main-branch prebuilt image for this exact prepared context
          # only after its provenance verifies; build any other target locally.
          # The builder, three clean runtimes and graphical runtime are
          # independent, so local builds run concurrently and any failure fails.
          python3 tools/ci/appimage/context_key.py --context build/appimage-context \
            --graphical-dockerfile tools/ci/appimage/graphical.Dockerfile \
            > build/appimage-evidence/context-key.txt
          context_key=$(cat build/appimage-evidence/context-key.txt)
          prebuilt_image() {
            local target="$1" local_tag="$2" digest_reference
            test -n "${PREBUILT_CONTEXT_KEY}" && test "${PREBUILT_CONTEXT_KEY}" = "${context_key}" || return 1
            digest_reference=$(python3 tools/ci/appimage/prebuilt_images.py select \
              --repository "${APPIMAGE_IMAGE_REPOSITORY}" --target "${target}" \
              --images "${PREBUILT_IMAGES}") || return 1
            docker pull --platform linux/amd64 "${digest_reference}" >&2 || return 1
            docker image inspect --format '{{join .RepoDigests "\n"}}' "${digest_reference}" \
              | grep -Fqx "${digest_reference}" || return 1
            docker tag "${digest_reference}" "${local_tag}" >&2 || return 1
            echo "${digest_reference}"
          }
          build_image() {
            local target="$1" local_tag="$2"
            if test "${target}" = graphical; then
              docker build --platform linux/amd64 --tag "${local_tag}" \
                --file tools/ci/appimage/graphical.Dockerfile build/appimage-context
            elif test "${target}" = build; then
              docker build --platform linux/amd64 --target build --tag "${local_tag}" \
                --build-arg "ATRINIK_COMPILER_IMAGE=${CLASSIC_LINUX_IMAGE}" \
                --file build/appimage-context/Dockerfile build/appimage-context
            else
              docker build --platform linux/amd64 --target "${target}" --tag "${local_tag}" \
                --file build/appimage-context/Dockerfile build/appimage-context
            fi
          }
          image_jobs=()
          : > build/appimage-evidence/image-sources.txt
          for entry in build:classic-appimage-build:image-build \
              smoke-ubuntu24:classic-appimage-ubuntu24:image-ubuntu24 \
              smoke-ubuntu26:classic-appimage-ubuntu26:image-ubuntu26 \
              smoke-debian13:classic-appimage-debian13:image-debian13 \
              graphical:classic-appimage-graphical:image-graphical; do
            IFS=: read -r target local_tag log_name <<<"${entry}"
            if digest_reference=$(prebuilt_image "${target}" "${local_tag}" \
                2>> "build/appimage-evidence/${log_name}-prebuilt.log"); then
              echo "${target} prebuilt ${digest_reference}" >> build/appimage-evidence/image-sources.txt
              continue
            fi
            echo "${target} built" >> build/appimage-evidence/image-sources.txt
            build_image "${target}" "${local_tag}" > "build/appimage-evidence/${log_name}.log" 2>&1 &
            image_jobs+=("$!")
          done
          image_failed=0
          for job in "${image_jobs[@]}"; do
            wait "${job}" || image_failed=1
          done
          test "${image_failed}" -eq 0
          docker image inspect classic-appimage-build classic-appimage-ubuntu24 \
            classic-appimage-ubuntu26 classic-appimage-debian13 classic-appimage-graphical \
            --format '{{.Id}}' > build/appimage-evidence/images.txt
          docker run --rm --network none classic-appimage-build cat /build-packages.tsv \
            > build/appimage-evidence/build-packages.tsv
      - name: Capture trusted runtime and graphical qualification probes
        run: |
          for probe in appimage-runtime-probe appimage-graphical-probe; do
            docker run --rm --platform linux/amd64 --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --cpus 2 --memory 4g \
              classic-appimage-build cat "/${probe}" \
              > "build/${probe}"
            test -f "build/${probe}"
            test ! -L "build/${probe}"
            test -s "build/${probe}"
            chmod 0755 "build/${probe}"
          done
      - name: Build AppImage with offline release inputs
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_epoch }}
          DISCORD_CONFIG_FILE: ${{ inputs.rehearsal != true && '/input/discord-config/discord-application-id' || '' }}
        run: |
          docker run --rm --platform linux/amd64 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --cpus 2 --memory 4g \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env ATRINIK_SOURCE_REVISION="${RELEASE_REVISION}" \
            --env SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --env ATRINIK_GPU_SHADER_DIRECTORY=/input/gpu-shaders \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/input/dependencies/client/build/dependencies/downloads \
            --env ATRINIK_DISCORD_APPLICATION_ID_FILE="${DISCORD_CONFIG_FILE}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/candidate-source,target=/input/source,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-inputs,target=/input/dependencies,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/gpu-shaders,target=/input/gpu-shaders,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/discord-config,target=/input/discord-config,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-packages,target=/output" \
            classic-appimage-build bash -c \
              'set -euo pipefail
               mkdir /tmp/source
               cp -a --no-preserve=ownership /input/source/. /tmp/source/
               cd /tmp/source/client
               test -f tools/tests/test_appimage_package_contract.py
               python3 -m unittest discover -s tools/tests -p test_appimage_package_contract.py
               bash tools/build-appimage.sh /output' \
            > build/appimage-evidence/build.log 2>&1
          # Candidate code cannot modify the runner checkout, automation, or
          # evidence. Reject symlink outputs before any host consumer opens one.
          package="build/appimage-packages/atrinik-classic-client-${RELEASE_VERSION}-linux-x86_64.AppImage"
          test -f "${package}" && test ! -L "${package}"
      - name: Validate AppImage payload with trusted host tools
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools llvm
          test -x /usr/bin/llvm-readelf
          python3 tools/release/appimage.py \
            "build/appimage-packages/atrinik-classic-client-${RELEASE_VERSION}-linux-x86_64.AppImage" \
            "${RELEASE_VERSION}" \
            --revision "${RELEASE_REVISION}" \
            --source-root "${GITHUB_WORKSPACE}/candidate-source" \
            --compiler-image "${CLASSIC_LINUX_IMAGE}" \
            > build/appimage-evidence/payload-validation.log 2>&1
      - name: Smoke in clean Ubuntu 24, Ubuntu 26, and Debian 13 runtimes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for runtime in ubuntu24 ubuntu26 debian13; do
            docker run --rm --platform linux/amd64 --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --cpus 2 --memory 4g \
              --env ATRINIK_APPIMAGE_SMOKE_CONTAINER=1 \
              --env ATRINIK_APPIMAGE_RUNTIME_PROBE=/input/appimage-runtime-probe \
              --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-packages,target=/packages,readonly" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/tools/ci/appimage/smoke.sh,target=/smoke.sh,readonly" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-runtime-probe,target=/input/appimage-runtime-probe,readonly" \
              "classic-appimage-${runtime}" bash /smoke.sh \
              "/packages/atrinik-classic-client-${RELEASE_VERSION}-linux-x86_64.AppImage" \
              "${RELEASE_VERSION}" > "build/appimage-evidence/smoke-${runtime}.log" 2>&1
          done
      - name: Qualify graphical dependencies, virtual window, and virtual audio
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          container_name="classic-appimage-graphical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          owner="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=$(docker create --name "${container_name}" \
            --label "atrinik.ci.graphical-owner=${owner}" \
            --platform linux/amd64 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --cpus 2 --memory 4g \
            --env ATRINIK_APPIMAGE_SMOKE_CONTAINER=1 \
            --env ATRINIK_APPIMAGE_GRAPHICAL_PROBE=/input/appimage-graphical-probe \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-packages,target=/packages,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tools/ci/appimage/graphical-smoke.sh,target=/graphical-smoke.sh,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-graphical-probe,target=/input/appimage-graphical-probe,readonly" \
            classic-appimage-graphical bash /graphical-smoke.sh \
            "/packages/atrinik-classic-client-${RELEASE_VERSION}-linux-x86_64.AppImage" \
            "${RELEASE_VERSION}" /tmp/graphical-evidence)
          [[ ${container_id} =~ ^[0-9a-f]{64}$ ]]
          cleanup() {
            status=$?
            trap - EXIT
            identity=$(docker inspect --format \
              '{{.Name}} {{index .Config.Labels "atrinik.ci.graphical-owner"}}' \
              "${container_id}") || exit 1
            if test "${identity}" != "/${container_name} ${owner}"; then
              echo "refusing to remove graphical container with changed ownership" >&2
              exit 1
            fi
            docker rm --force "${container_id}" \
              > build/appimage-evidence/graphical-cleanup.log 2>&1 || status=1
            exit "${status}"
          }
          trap cleanup EXIT
          smoke_status=0
          docker start --attach "${container_id}" \
            > build/appimage-evidence/graphical-qualification.log 2>&1 || smoke_status=$?
          completeness=()
          if test "${smoke_status}" -eq 0; then
            completeness=(--complete)
          fi
          export_status=0
          docker cp "${container_id}:/tmp/graphical-evidence/." - \
            2> build/appimage-evidence/graphical-copy.log | \
            python3 tools/ci/appimage/export_graphical_evidence.py \
              --output build/appimage-evidence/graphical "${completeness[@]}" \
              > build/appimage-evidence/graphical-export.log 2>&1 || export_status=$?
          test "${smoke_status}" -eq 0 || exit "${smoke_status}"
          test "${export_status}" -eq 0 || exit "${export_status}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-client-appimage-${{ needs.metadata.outputs.tag }}
          path: build/appimage-packages/atrinik-classic-client-${{ needs.metadata.outputs.version }}-linux-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain AppImage build, payload, and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-appimage-evidence-${{ needs.metadata.outputs.tag }}
          path: build/appimage-evidence
          if-no-files-found: warn
          retention-days: 30

  client-windows:
    name: Build Windows client package
    env:
      WINDOWS_BUILD_IMAGE: ${{ needs.metadata.outputs.windows_image }}
      WINDOWS_BUILD_CACHE_EPOCH: ${{ needs.metadata.outputs.windows_cache_epoch }}
    needs: [metadata, dependencies, gpu-shaders]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - name: Check out trusted Windows producer selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: build/windows-automation
          persist-credentials: false
          sparse-checkout: tools/release/windows_producer.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
      - name: Retrieve release-only Discord configuration
        if: inputs.rehearsal != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: discord-application-id-${{ inputs.tag }}
          path: build/discord-config
      - name: Restore Windows client compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: client/build/ccache
          key: >-
            classic-${{ runner.os }}-${{ runner.arch }}-windows-client-ccache-v1-${{ env.WINDOWS_BUILD_CACHE_EPOCH }}-${{ needs.metadata.outputs.version }}-${{
            hashFiles('cmake/**', 'client/CMakeLists.txt', 'client/CMakePresets.json',
            'client/cmake/**', 'client/dependencies.lock.json', 'client/src/**',
            'protocol/CMakeLists.txt', 'protocol/cmake/**', 'protocol/generated/c/**',
            'protocol/schema/**', 'libatrinik/CMakeLists.txt', 'libatrinik/cmake/**',
            'libatrinik/dependencies.lock.json', 'libatrinik/**/*.c',
            'libatrinik/**/*.h') }}
          restore-keys: |
            classic-${{ runner.os }}-${{ runner.arch }}-windows-client-ccache-v1-${{ env.WINDOWS_BUILD_CACHE_EPOCH }}-
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: docker pull "${WINDOWS_BUILD_IMAGE}"
      - name: Build portable package from monorepo siblings
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
          DISCORD_CONFIG_FILE: ${{ inputs.rehearsal != true && '/workspace/build/discord-config/discord-application-id' || '' }}
        run: |
          arguments_path=$(mktemp "${RUNNER_TEMP}/classic-windows-environment.XXXXXX")
          trap 'rm -f "${arguments_path}"' EXIT
          python3 build/windows-automation/tools/release/windows_producer.py \
            --source-root "${GITHUB_WORKSPACE}" --revision "${RELEASE_REVISION}" \
            --format docker-env > "${arguments_path}"
          mapfile -t producer_environment < "${arguments_path}"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env ATRINIK_GPU_SHADER_DIRECTORY=/workspace/build/gpu-shaders \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/workspace/client/build/dependencies/downloads \
            --env ATRINIK_DISCORD_APPLICATION_ID_FILE="${DISCORD_CONFIG_FILE}" \
            --env CCACHE_DIR=/workspace/client/build/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env CCACHE_TEMPDIR=/tmp/atrinik-client-ccache \
            "${producer_environment[@]}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/client \
            "${WINDOWS_BUILD_IMAGE}" \
            bash -c \
              'set -euo pipefail
               ccache --zero-stats
               bash tools/build-windows-package.sh build/packages
               ccache --show-stats'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-client-windows-${{ needs.metadata.outputs.tag }}
          path: client/build/packages/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

