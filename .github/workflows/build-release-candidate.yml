name: Build Release Candidate

on:
  workflow_call:
    inputs:
      rehearsal:
        description: Build and validate without publishing
        default: true
        required: false
        type: boolean
      revision:
        description: Exact preflight-validated candidate commit
        default: ""
        required: false
        type: string
      source_epoch:
        description: Exact preflight-validated candidate source epoch
        default: ""
        required: false
        type: string
      tag:
        description: Existing unified semantic-release tag to package
        default: ""
        required: false
        type: string
      version:
        description: Non-production semantic version used in rehearsal artifacts
        default: 0.0.0
        required: false
        type: string
    outputs:
      commit:
        description: Exact candidate commit
        value: ${{ jobs.metadata.outputs.commit }}
      source_epoch:
        description: Candidate source epoch
        value: ${{ jobs.metadata.outputs.source_epoch }}
      tag:
        description: Candidate artifact namespace
        value: ${{ jobs.metadata.outputs.tag }}
      version:
        description: Candidate semantic version
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  packages: read

env:
  CLASSIC_LINUX_IMAGE: ghcr.io/atrinik/classic-build:1.16.0@sha256:e1c366dbf83ef987765ff913bbb193868314a139ae1e00cc134b22a3159464f2
  WINDOWS_BUILD_CACHE_EPOCH: 1.16.0-4266256d4b4196241df6463e687dd286022e24e3bc46dfafb4f877744a731d69

concurrency:
  group: >-
    classic-release-candidate-${{ inputs.tag || inputs.revision || github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Bind preflight-validated candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      source_epoch: ${{ steps.metadata.outputs.source_epoch }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      artifact_schema: ${{ steps.metadata.outputs.artifact_schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.revision }}
      - name: Check out the trusted artifact-contract reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build/release-automation
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/release
      - id: metadata
        name: Validate immutable candidate coordinates
        env:
          RELEASE_COMMIT: ${{ inputs.revision }}
          RELEASE_REHEARSAL: ${{ inputs.rehearsal }}
          RELEASE_SOURCE_EPOCH: ${{ inputs.source_epoch }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          commit=$(git rev-parse "${RELEASE_COMMIT}^{commit}")
          test "${commit}" = "$(git rev-parse HEAD)"
          source_epoch=$(git show -s --format=%ct "${commit}")
          if test -n "${RELEASE_SOURCE_EPOCH}"; then
            test "${source_epoch}" = "${RELEASE_SOURCE_EPOCH}"
          fi
          [[ ${RELEASE_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if test "${RELEASE_REHEARSAL}" = true; then
            test "${RELEASE_TAG}" = "rehearsal-${commit}"
          else
            test "${RELEASE_TAG}" = "v${RELEASE_VERSION}"
            test -n "${RELEASE_SOURCE_EPOCH}"
          fi
          artifact_schema=$(python3 build/release-automation/tools/release/release_artifacts.py \
            --print-source-schema --revision "${commit}" --source-root "${GITHUB_WORKSPACE}")
          [[ ${artifact_schema} == 1 || ${artifact_schema} == 2 || ${artifact_schema} == 3 ]]
          {
            echo "artifact_schema=${artifact_schema}"
            echo "tag=${RELEASE_TAG}"
            echo "version=${RELEASE_VERSION}"
            echo "commit=${commit}"
            echo "source_epoch=${source_epoch}"
          } >>"${GITHUB_OUTPUT}"

  dependencies:
    name: Verify durable dependency bundle
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull, verify, and install the exact durable bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/install_dependency_bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: |
            client/build/dependencies/downloads/*.tar.gz
            server/build/dependencies/downloads/*.tar.gz
            server/build/dependency-cache/downloads/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  gpu-shaders:
    name: Build release GPU shader cohort
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gpu-shader-downloads
          key: >-
            gpu-shader-inputs-v1-${{ hashFiles('client/shaders/toolchain.lock.json',
            'client/tools/prepare_gpu_shader_toolchain.py') }}
      - name: Compile and validate the locked release shader cohort
        run: >-
          tools/ci/prepare_gpu_shaders.sh
          "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/gpu-shader-downloads"
          "${GITHUB_WORKSPACE}/build/gpu-shaders"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
          if-no-files-found: error
          retention-days: 1

  sources:
    name: Build source packages and protocol wheel
    permissions:
      contents: read
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: >-
          python3 tools/release/package_sources.py
          --version '${{ needs.metadata.outputs.version }}'
          --revision '${{ needs.metadata.outputs.commit }}'
          --output build/release
      - name: Build wheel from the scoped source package
        run: |
          python3 -m pip install build==1.3.0
          python3 tools/release/build_protocol_wheel.py \
            --version '${{ needs.metadata.outputs.version }}' \
            --source 'build/release/atrinik-classic-protocol-${{ needs.metadata.outputs.version }}.tar.gz' \
            --source-epoch '${{ needs.metadata.outputs.source_epoch }}' \
            --output build/release
      - name: Install and import the wheel without dependencies
        run: |
          python3 -m venv build/wheel-smoke
          build/wheel-smoke/bin/python -m pip install --no-deps \
            build/release/atrinik_classic_protocol-*-py3-none-any.whl
          build/wheel-smoke/bin/python -c \
            'import atrinik_protocol; assert atrinik_protocol.PROTOCOL_VERSION > 0'
      - name: Pull the immutable installed-library toolchain anonymously
        run: docker pull "${CLASSIC_LINUX_IMAGE}"
      - name: Build the extracted unified library and exact-version consumer
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
        run: |
          bash tools/ci/check_installed_library.sh \
            "${CLASSIC_LINUX_IMAGE}" \
            "build/release/atrinik-classic-libatrinik-${RELEASE_VERSION}.tar.gz" \
            "${RELEASE_VERSION}" "${RELEASE_REVISION}" \
            "build/installed-library-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source-protocol-${{ needs.metadata.outputs.tag }}
          path: |
            build/release/*.tar.gz
            build/release/*.whl
          if-no-files-found: error
          retention-days: 30

  client-linux:
    name: Build and install Debian client package
    needs: [metadata, dependencies, gpu-shaders]
    if: needs.metadata.outputs.artifact_schema == '2'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Image preparation and runtime smoke belong to the trusted caller.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Check out candidate source as container input only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          path: candidate-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: build/linux-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
      - name: Retrieve release-only Discord configuration
        if: inputs.rehearsal != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: discord-application-id-${{ inputs.tag }}
          path: build/discord-config
      - name: Prepare pinned Debian testing build and clean runtime
        run: |
          docker build --platform linux/amd64 --target build --tag classic-deb-build \
            --file tools/ci/debian-client/Dockerfile tools/ci/debian-client
          docker build --platform linux/amd64 --target runtime --tag classic-deb-runtime \
            --file tools/ci/debian-client/Dockerfile tools/ci/debian-client
          mkdir -p build/linux-package-evidence build/linux-packages build/discord-config
          docker image inspect classic-deb-build classic-deb-runtime \
            --format '{{.Id}}' > build/linux-package-evidence/images.txt
          docker run --rm --network none classic-deb-build cat /build-packages.tsv \
            > build/linux-package-evidence/build-packages.tsv
      - name: Build client with distribution libraries and offline release inputs
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_epoch }}
          DISCORD_CONFIG_FILE: ${{ inputs.rehearsal != true && '/input/discord-config/discord-application-id' || '' }}
        run: |
          docker run --rm --platform linux/amd64 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --cpus 2 --memory 8g \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --env ATRINIK_GPU_SHADER_DIRECTORY=/input/gpu-shaders \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/input/dependencies/client/build/dependencies/downloads \
            --env ATRINIK_DISCORD_APPLICATION_ID_FILE="${DISCORD_CONFIG_FILE}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/candidate-source,target=/input/source,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-inputs,target=/input/dependencies,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/gpu-shaders,target=/input/gpu-shaders,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/discord-config,target=/input/discord-config,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-packages,target=/output" \
            classic-deb-build bash -c \
              'set -euo pipefail
               mkdir /tmp/source
               cp -a --no-preserve=ownership /input/source/. /tmp/source/
               cd /tmp/source/client
               test -f tools/tests/test_linux_package_contract.py
               python3 -m unittest discover -s tools/tests -p test_linux_package_contract.py
               bash tools/build-linux-package.sh /output' \
            > build/linux-package-evidence/build.log 2>&1
          # Candidate code cannot modify the runner checkout, automation, or
          # evidence. Reject symlink outputs before any host consumer opens one.
          package="build/linux-packages/atrinik-classic-client-${RELEASE_VERSION}-linux-amd64.deb"
          test -f "${package}" && test ! -L "${package}"
      - name: Install through APT without build tools or source checkouts
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm --platform linux/amd64 --security-opt no-new-privileges \
            --cpus 2 --memory 4g --env ATRINIK_DEB_SMOKE_CONTAINER=1 \
            --env DEBIAN_FRONTEND=noninteractive \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-packages,target=/packages,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tools/ci/smoke_linux_client_package.sh,target=/smoke.sh,readonly" \
            classic-deb-runtime bash /smoke.sh \
            "/packages/atrinik-classic-client-${RELEASE_VERSION}-linux-amd64.deb" \
            "${RELEASE_VERSION}" > build/linux-package-evidence/install.log 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-client-linux-${{ needs.metadata.outputs.tag }}
          path: build/linux-packages/atrinik-classic-client-${{ needs.metadata.outputs.version }}-linux-amd64.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain package build and installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-linux-evidence-${{ needs.metadata.outputs.tag }}
          path: build/linux-package-evidence
          if-no-files-found: warn
          retention-days: 30

  client-appimage:
    name: Build and smoke Ubuntu-baseline AppImage
    needs: [metadata, dependencies, gpu-shaders]
    if: needs.metadata.outputs.artifact_schema == '3'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Image preparation and runtime smoke belong to the trusted caller.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/ci/appimage
            tools/release
      - name: Check out candidate source as container input only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          path: candidate-source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: build/linux-inputs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
      - name: Retrieve release-only Discord configuration
        if: inputs.rehearsal != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: discord-application-id-${{ inputs.tag }}
          path: build/discord-config
      - name: Prepare pinned Ubuntu builder and clean runtime images
        run: |
          mkdir -p build/appimage-evidence build/appimage-packages build/discord-config
          python3 tools/ci/appimage/prepare.py --output build/appimage-context \
            > build/appimage-evidence/prepare.log 2>&1
          cp build/appimage-context/packaging.lock.json build/appimage-evidence/
          docker build --platform linux/amd64 --target build --tag classic-appimage-build \
            --file build/appimage-context/Dockerfile build/appimage-context \
            > build/appimage-evidence/image-build.log 2>&1
          for runtime in ubuntu24 ubuntu26 debian13; do
            docker build --platform linux/amd64 --target "smoke-${runtime}" \
              --tag "classic-appimage-${runtime}" \
              --file build/appimage-context/Dockerfile build/appimage-context \
              > "build/appimage-evidence/image-${runtime}.log" 2>&1
          done
          docker image inspect classic-appimage-build classic-appimage-ubuntu24 \
            classic-appimage-ubuntu26 classic-appimage-debian13 \
            --format '{{.Id}}' > build/appimage-evidence/images.txt
          docker run --rm --network none classic-appimage-build cat /build-packages.tsv \
            > build/appimage-evidence/build-packages.tsv
      - name: Capture trusted runtime acceptance probe
        run: |
          docker run --rm --platform linux/amd64 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --cpus 2 --memory 4g \
            classic-appimage-build cat /appimage-runtime-probe \
            > build/appimage-runtime-probe
          test -f build/appimage-runtime-probe
          test ! -L build/appimage-runtime-probe
          test -s build/appimage-runtime-probe
          chmod 0755 build/appimage-runtime-probe
      - name: Build AppImage with offline release inputs
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_epoch }}
          DISCORD_CONFIG_FILE: ${{ inputs.rehearsal != true && '/input/discord-config/discord-application-id' || '' }}
        run: |
          docker run --rm --platform linux/amd64 --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --cpus 2 --memory 4g \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env ATRINIK_SOURCE_REVISION="${RELEASE_REVISION}" \
            --env SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --env ATRINIK_GPU_SHADER_DIRECTORY=/input/gpu-shaders \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/input/dependencies/client/build/dependencies/downloads \
            --env ATRINIK_DISCORD_APPLICATION_ID_FILE="${DISCORD_CONFIG_FILE}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/candidate-source,target=/input/source,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/linux-inputs,target=/input/dependencies,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/gpu-shaders,target=/input/gpu-shaders,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/discord-config,target=/input/discord-config,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-packages,target=/output" \
            classic-appimage-build bash -c \
              'set -euo pipefail
               mkdir /tmp/source
               cp -a --no-preserve=ownership /input/source/. /tmp/source/
               cd /tmp/source/client
               test -f tools/tests/test_appimage_package_contract.py
               python3 -m unittest discover -s tools/tests -p test_appimage_package_contract.py
               bash tools/build-appimage.sh /output' \
            > build/appimage-evidence/build.log 2>&1
          # Candidate code cannot modify the runner checkout, automation, or
          # evidence. Reject symlink outputs before any host consumer opens one.
          package="build/appimage-packages/atrinik-classic-client-${RELEASE_VERSION}-linux-x86_64.AppImage"
          test -f "${package}" && test ! -L "${package}"
      - name: Validate AppImage payload with trusted host tools
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools binutils
          python3 tools/release/appimage.py \
            "build/appimage-packages/atrinik-classic-client-${RELEASE_VERSION}-linux-x86_64.AppImage" \
            "${RELEASE_VERSION}" \
            --revision "${RELEASE_REVISION}" \
            --source-root "${GITHUB_WORKSPACE}/candidate-source" \
            > build/appimage-evidence/payload-validation.log 2>&1
      - name: Smoke in clean Ubuntu 24, Ubuntu 26, and Debian 13 runtimes
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for runtime in ubuntu24 ubuntu26 debian13; do
            docker run --rm --platform linux/amd64 --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --cpus 2 --memory 4g \
              --env ATRINIK_APPIMAGE_SMOKE_CONTAINER=1 \
              --env ATRINIK_APPIMAGE_RUNTIME_PROBE=/input/appimage-runtime-probe \
              --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-packages,target=/packages,readonly" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/tools/ci/appimage/smoke.sh,target=/smoke.sh,readonly" \
              --mount "type=bind,source=$GITHUB_WORKSPACE/build/appimage-runtime-probe,target=/input/appimage-runtime-probe,readonly" \
              "classic-appimage-${runtime}" bash /smoke.sh \
              "/packages/atrinik-classic-client-${RELEASE_VERSION}-linux-x86_64.AppImage" \
              "${RELEASE_VERSION}" > "build/appimage-evidence/smoke-${runtime}.log" 2>&1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-client-appimage-${{ needs.metadata.outputs.tag }}
          path: build/appimage-packages/atrinik-classic-client-${{ needs.metadata.outputs.version }}-linux-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Retain AppImage build, payload, and runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: client-appimage-evidence-${{ needs.metadata.outputs.tag }}
          path: build/appimage-evidence
          if-no-files-found: warn
          retention-days: 30

  client-windows:
    name: Build Windows client package
    needs: [metadata, dependencies, gpu-shaders]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-gpu-shaders-${{ needs.metadata.outputs.tag }}
          path: build/gpu-shaders
      - name: Retrieve release-only Discord configuration
        if: inputs.rehearsal != true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: discord-application-id-${{ inputs.tag }}
          path: build/discord-config
      - name: Restore Windows client compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: client/build/ccache
          key: >-
            classic-${{ runner.os }}-${{ runner.arch }}-windows-client-ccache-v1-${{ env.WINDOWS_BUILD_CACHE_EPOCH }}-${{ needs.metadata.outputs.version }}-${{
            hashFiles('cmake/**', 'client/CMakeLists.txt', 'client/CMakePresets.json',
            'client/cmake/**', 'client/dependencies.lock.json', 'client/src/**',
            'protocol/CMakeLists.txt', 'protocol/cmake/**', 'protocol/generated/c/**',
            'protocol/schema/**', 'libatrinik/CMakeLists.txt', 'libatrinik/cmake/**',
            'libatrinik/dependencies.lock.json', 'libatrinik/**/*.c',
            'libatrinik/**/*.h') }}
          restore-keys: |
            classic-${{ runner.os }}-${{ runner.arch }}-windows-client-ccache-v1-${{ env.WINDOWS_BUILD_CACHE_EPOCH }}-
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: docker pull ghcr.io/atrinik/windows-build:1.16.0@sha256:4266256d4b4196241df6463e687dd286022e24e3bc46dfafb4f877744a731d69
      - name: Build portable package from monorepo siblings
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          DISCORD_CONFIG_FILE: ${{ inputs.rehearsal != true && '/workspace/build/discord-config/discord-application-id' || '' }}
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env ATRINIK_GPU_SHADER_DIRECTORY=/workspace/build/gpu-shaders \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/workspace/client/build/dependencies/downloads \
            --env ATRINIK_DISCORD_APPLICATION_ID_FILE="${DISCORD_CONFIG_FILE}" \
            --env CCACHE_DIR=/workspace/client/build/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env CCACHE_TEMPDIR=/tmp/atrinik-client-ccache \
            --env PATH=/opt/mxe/.ccache/bin:/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/client \
            ghcr.io/atrinik/windows-build:1.16.0@sha256:4266256d4b4196241df6463e687dd286022e24e3bc46dfafb4f877744a731d69 \
            bash -c \
              'set -euo pipefail
               ccache --zero-stats
               bash tools/build-windows-package.sh build/packages
               ccache --show-stats'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-client-windows-${{ needs.metadata.outputs.tag }}
          path: client/build/packages/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  server-windows:
    name: Build Windows server package
    needs: [metadata, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: .
      - name: Restore Windows server compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: server/build/ccache
          key: >-
            classic-${{ runner.os }}-${{ runner.arch }}-windows-server-ccache-v1-${{ env.WINDOWS_BUILD_CACHE_EPOCH }}-${{ needs.metadata.outputs.version }}-${{
            hashFiles('cmake/**', 'server/CMakeLists.txt', 'server/CMakePresets.json',
            'server/cmake/**', 'server/dependencies.lock.json', 'server/src/**',
            'protocol/CMakeLists.txt', 'protocol/cmake/**', 'protocol/generated/c/**',
            'protocol/schema/**', 'libatrinik/CMakeLists.txt', 'libatrinik/cmake/**',
            'libatrinik/dependencies.lock.json', 'libatrinik/**/*.c',
            'libatrinik/**/*.h') }}
          restore-keys: |
            classic-${{ runner.os }}-${{ runner.arch }}-windows-server-ccache-v1-${{ env.WINDOWS_BUILD_CACHE_EPOCH }}-
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: docker pull ghcr.io/atrinik/windows-build:1.16.0@sha256:4266256d4b4196241df6463e687dd286022e24e3bc46dfafb4f877744a731d69
      - name: Build portable package from monorepo siblings
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/workspace/server/build/dependencies/downloads \
            --env ATRINIK_DEPENDENCY_CACHE_DIR=/workspace/server/build/dependency-cache \
            --env CCACHE_DIR=/workspace/server/build/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env CCACHE_TEMPDIR=/tmp/atrinik-server-ccache \
            --env PATH=/opt/mxe/.ccache/bin:/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/server \
            ghcr.io/atrinik/windows-build:1.16.0@sha256:4266256d4b4196241df6463e687dd286022e24e3bc46dfafb4f877744a731d69 \
            bash -c \
              'set -euo pipefail
               ccache --zero-stats
               bash tools/build-windows-package.sh build/packages
               ccache --show-stats'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-server-windows-${{ needs.metadata.outputs.tag }}
          path: server/build/packages/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  server-image:
    name: Build classic server image without publishing
    needs: [metadata, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: .
      - id: release-inputs
        name: Record locked server image inputs
        run: |
          python3 tools/release/locked_inputs.py \
            --version '${{ needs.metadata.outputs.version }}' \
            --component server \
            --github-output "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: ATRINIK_PACKAGE_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=classic-server
          cache-to: type=gha,mode=max,scope=classic-server
          context: .
          file: server/Dockerfile
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Atrinik Classic Server
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            ${{ steps.release-inputs.outputs.labels }}
          load: false
          provenance: mode=max
          push: false
          sbom: true
          tags: ghcr.io/atrinik/classic-server:${{ needs.metadata.outputs.version }}

  candidate:
    name: Validate complete release candidate
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.sources.result == 'success' &&
      needs.gpu-shaders.result == 'success' &&
      needs.client-windows.result == 'success' &&
      needs.server-windows.result == 'success' &&
      needs.server-image.result == 'success' &&
      ((needs.metadata.outputs.artifact_schema == '3' && needs.client-appimage.result == 'success' && needs.client-linux.result == 'skipped') ||
      (needs.metadata.outputs.artifact_schema == '2' && needs.client-linux.result == 'success' && needs.client-appimage.result == 'skipped') ||
      (needs.metadata.outputs.artifact_schema == '1' && needs.client-linux.result == 'skipped' && needs.client-appimage.result == 'skipped'))
    needs:
      - metadata
      - sources
      - gpu-shaders
      - client-linux
      - client-appimage
      - client-windows
      - server-windows
      - server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*-${{ needs.metadata.outputs.tag }}
          path: build/release
          merge-multiple: true
      - name: Install trusted AppImage inspection tools
        if: needs.metadata.outputs.artifact_schema == '3'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools binutils
      - name: Validate and index the complete candidate
        run: >-
          python3 tools/release/finalize_artifacts.py
          --version '${{ needs.metadata.outputs.version }}'
          --revision '${{ needs.metadata.outputs.commit }}'
          --source-epoch '${{ needs.metadata.outputs.source_epoch }}'
          --directory build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: complete-release-candidate-${{ needs.metadata.outputs.tag }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
