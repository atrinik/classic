  server-image:
    name: Build classic server image without publishing
    needs: [metadata, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-dependencies-${{ needs.metadata.outputs.tag }}
          path: .
      - id: release-inputs
        name: Record locked server image inputs
        run: |
          python3 tools/release/locked_inputs.py \
            --version '${{ needs.metadata.outputs.version }}' \
            --component server \
            --github-output "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          build-args: ATRINIK_PACKAGE_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=classic-server
          cache-to: type=gha,mode=max,scope=classic-server
          context: .
          file: server/Dockerfile
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Atrinik Classic Server
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            ${{ steps.release-inputs.outputs.labels }}
          load: false
          provenance: mode=max
          push: false
          sbom: true
          tags: ghcr.io/atrinik/classic-server:${{ needs.metadata.outputs.version }}

  appimage-prebuilt:
    name: Verify reusable AppImage images
    env:
      CLASSIC_LINUX_IMAGE: ${{ needs.metadata.outputs.compiler_image }}
    # Holds a read-only token only to verify main-branch provenance of
    # prebuilt images for this exact prepared context. It never checks out the
    # candidate: the metadata job supplies the resolved compiler image and the
    # exact tagged lock bytes. Any failure only makes the AppImage job build
    # locally.
    needs: [metadata]
    if: needs.metadata.outputs.artifact_schema == '3'
    continue-on-error: true
    permissions:
      attestations: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      context_key: ${{ steps.verify.outputs.context_key }}
      images: ${{ steps.verify.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/ci/appimage
            tools/release
      - id: verify
        name: Verify prebuilt images for the exact prepared context
        env:
          SOURCE_PACKAGING_LOCK: ${{ needs.metadata.outputs.source_packaging_lock }}
          APPIMAGE_IMAGE_REPOSITORY: ghcr.io/atrinik/classic-appimage
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/appimage-prebuilt
          source_lock_path=$(mktemp "${RUNNER_TEMP}/classic-source-packaging-lock.XXXXXX")
          trap 'rm -f "${source_lock_path}"' EXIT
          if test -n "${SOURCE_PACKAGING_LOCK}"; then
            printf '%s' "${SOURCE_PACKAGING_LOCK}" | base64 -d | gzip -dc > "${source_lock_path}"
          fi
          compiler_arguments=()
          if test -s "${source_lock_path}"; then
            compiler_arguments=(--source-packaging-lock "${source_lock_path}")
          fi
          python3 tools/ci/appimage/prepare.py --output build/appimage-context \
            --compiler-image "${CLASSIC_LINUX_IMAGE}" "${compiler_arguments[@]}" \
            > build/appimage-prebuilt/prepare.log 2>&1
          context_key=$(python3 tools/ci/appimage/context_key.py --context build/appimage-context \
            --graphical-dockerfile tools/ci/appimage/graphical.Dockerfile)
          images='{}'
          for target in build smoke-ubuntu24 smoke-ubuntu26 smoke-debian13 graphical; do
            reference="${APPIMAGE_IMAGE_REPOSITORY}:${target}-${context_key}"
            if docker pull --platform linux/amd64 "${reference}" >&2 &&
                digest_reference=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "${reference}" \
                  | grep -E "^${APPIMAGE_IMAGE_REPOSITORY}@sha256:[0-9a-f]{64}$" | head -n 1) &&
                gh attestation verify "oci://${digest_reference}" --repo atrinik/classic \
                  --signer-workflow atrinik/classic/.github/workflows/appimage-images.yml \
                  --source-ref refs/heads/main >&2 &&
                recorded=$(python3 tools/ci/appimage/prebuilt_images.py record \
                  --repository "${APPIMAGE_IMAGE_REPOSITORY}" --target "${target}" \
                  --images "${images}" --reference "${digest_reference}"); then
              images="${recorded}"
              echo "verified ${target}: ${digest_reference}"
            else
              echo "no verified prebuilt image for ${target}; the release builds it locally"
            fi
          done
          {
            echo "context_key=${context_key}"
            echo "images=${images}"
          } >> "${GITHUB_OUTPUT}"

  candidate:
    name: Validate complete release candidate
    env:
      CLASSIC_LINUX_IMAGE: ${{ needs.metadata.outputs.compiler_image }}
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.sources.result == 'success' &&
      needs.gpu-shaders.result == 'success' &&
      needs.client-windows.result == 'success' &&
      needs.server-windows.result == 'success' &&
      needs.server-image.result == 'success' &&
      ((needs.metadata.outputs.artifact_schema == '3' && needs.client-appimage.result == 'success' && needs.client-linux.result == 'skipped') ||
      (needs.metadata.outputs.artifact_schema == '2' && needs.client-linux.result == 'success' && needs.client-appimage.result == 'skipped') ||
      (needs.metadata.outputs.artifact_schema == '1' && needs.client-linux.result == 'skipped' && needs.client-appimage.result == 'skipped'))
    needs:
      - metadata
      - sources
      - gpu-shaders
      - client-linux
      - client-appimage
      - client-windows
      - server-windows
      - server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*-${{ needs.metadata.outputs.tag }}
          path: build/release
          merge-multiple: true
      - name: Install trusted AppImage inspection tools
        if: needs.metadata.outputs.artifact_schema == '3'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends squashfs-tools llvm
          test -x /usr/bin/llvm-readelf
      - name: Check out the trusted compiler-image resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: build/ci-automation
          persist-credentials: false
          sparse-checkout: tools/release/resolve_compiler_image.py
      - name: Validate and index the complete candidate
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REVISION: ${{ needs.metadata.outputs.commit }}
          RELEASE_SOURCE_EPOCH: ${{ needs.metadata.outputs.source_epoch }}
        run: |
          arguments_path=$(mktemp "${RUNNER_TEMP}/classic-compiler-arguments.XXXXXX")
          trap 'rm -f "${arguments_path}"' EXIT
          python3 build/ci-automation/tools/release/resolve_compiler_image.py \
            --source-root "${GITHUB_WORKSPACE}" --revision "${RELEASE_REVISION}" \
            --current-image "${CLASSIC_LINUX_IMAGE}" --source-finalizer-arguments \
            > "${arguments_path}"
          mapfile -t compiler_arguments < "${arguments_path}"
          python3 tools/release/finalize_artifacts.py \
            --version "${RELEASE_VERSION}" --revision "${RELEASE_REVISION}" \
            --source-epoch "${RELEASE_SOURCE_EPOCH}" --directory build/release \
            "${compiler_arguments[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: complete-release-candidate-${{ needs.metadata.outputs.tag }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
