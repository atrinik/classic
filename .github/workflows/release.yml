name: Semantic Release

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  attestations: read
  checks: read
  contents: write
  packages: read

concurrency:
  group: classic-release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ATRINIK_RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Require a supported release branch and workflow definition
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          [[ ${RELEASE_BRANCH} == main || ${RELEASE_BRANCH} =~ ^[0-9]+\.[0-9]+\.x$ ]]
          if test "${RELEASE_EVENT}" = workflow_run; then
            test "${GITHUB_REF}" = refs/heads/main
          else
            test "${GITHUB_REF}" = "refs/heads/${RELEASE_BRANCH}"
          fi
          if test "${RELEASE_EVENT}" = workflow_run; then
            test -n "${RELEASE_TRIGGER_SHA}"
          fi
      - name: Check out the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify release branch policy
        run: node tools/tests/test_release_policy.cjs
      - name: Require the validated current release-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          commit=$(git rev-parse HEAD)
          test "${commit}" = "$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}")"
          if test "${RELEASE_EVENT}" = workflow_run; then
            test "${commit}" = "${RELEASE_TRIGGER_SHA}"
          fi
          successful=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${RELEASE_REPOSITORY}/commits/${commit}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "Classic validation" and .conclusion == "success" and .app.id == 15368)] | length')
          test "${successful}" -ge 1
          python3 tools/verify_import_history.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Require the exact durable dependency bundle before versioning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if tools/release/install_dependency_bundle.sh; then
              exit 0
            fi
            if test "${attempt}" -eq 10; then
              echo "durable dependency bundle is unavailable after 10 attempts; run Publish Dependency Bundle on current main" >&2
              exit 1
            fi
            sleep 30
          done
      - name: Rebind release mutation to the current release branch
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          git fetch --no-tags origin "${RELEASE_BRANCH}"
          commit=$(git rev-parse HEAD)
          test "${commit}" = "$(git rev-parse "refs/remotes/origin/${RELEASE_BRANCH}")"
          if test "${RELEASE_EVENT}" = workflow_run; then
            test "${commit}" = "${RELEASE_TRIGGER_SHA}"
          fi
      - id: pending-release
        name: Detect an incomplete semantic release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/release/resolve_pending_release.py \
            --repository "${RELEASE_REPOSITORY}" \
            --branch "${ATRINIK_RELEASE_BRANCH}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Delete the policy-listed empty failed draft
        if: steps.pending-release.outputs.action == 'delete-empty-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.pending-release.outputs.release_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.pending-release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/release/resolve_pending_release.py \
            --repository "${RELEASE_REPOSITORY}" \
            --branch "${ATRINIK_RELEASE_BRANCH}" \
            --delete-policy-listed-empty-draft \
            --expected-tag "${RELEASE_TAG}" \
            --expected-release-id "${RELEASE_ID}"
      - name: Resume the incomplete package release
        if: steps.pending-release.outputs.action == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.pending-release.outputs.tag }}
        run: >-
          gh workflow run package-release.yml
          --repo "${RELEASE_REPOSITORY}"
          --ref "${ATRINIK_RELEASE_BRANCH}"
          --field "tag=${RELEASE_TAG}"
          --field "source_branch=${ATRINIK_RELEASE_BRANCH}"
      - name: Analyze commits, tag, and publish release notes
        if: steps.pending-release.outputs.action != 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_REF="refs/heads/${ATRINIK_RELEASE_BRANCH}"
          export GITHUB_REF_NAME="${ATRINIK_RELEASE_BRANCH}"
          release_commit=$(git rev-parse HEAD)
          export GITHUB_SHA="${release_commit}"
          npx --yes \
            --package=semantic-release@25.0.9 \
            --package=@semantic-release/commit-analyzer@13.0.1 \
            --package=@semantic-release/release-notes-generator@14.1.1 \
            --package=@semantic-release/exec@7.1.0 \
            --package=conventional-changelog-conventionalcommits@9.3.1 \
            node tools/release/run_semantic_release.mjs
