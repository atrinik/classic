name: Semantic Release

on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
  workflow_run:
    workflows: [Check, Package Release]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  attestations: read
  checks: read
  contents: write
  packages: read

jobs:
  release:
    name: Semantic release
    if: >-
      github.repository == 'atrinik/classic' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'Check' &&
      github.event.workflow_run.path == '.github/workflows/check.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event.workflow_run.name == 'Package Release' &&
      github.event.workflow_run.path == '.github/workflows/package-release.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch'))))
    # Retain pending package/recovery runs as well as the newest checked batch.
    concurrency:
      group: classic-release-publication
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ATRINIK_RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Require a canonical release branch before checkout
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_TRIGGER_SHA: ${{ github.sha }}
        run: |
          [[ ${RELEASE_BRANCH} == main || ${RELEASE_BRANCH} =~ ^[0-9]+\.[0-9]+\.x$ ]]
          test "${GITHUB_REF}" = "refs/heads/${RELEASE_BRANCH}"
          test "${GITHUB_WORKFLOW_REF}" = "atrinik/classic/.github/workflows/release.yml@refs/heads/${RELEASE_BRANCH}"
          [[ ${RELEASE_TRIGGER_SHA} =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the protected workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: batch
        name: Select the current trusted checked release batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/release/select_release_batch.py
          --github-output "${GITHUB_OUTPUT}"
      - name: Check out the exact checked release commit
        if: steps.batch.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.batch.outputs.revision }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.batch.outputs.proceed == 'true'
        with:
          node-version: "24"
      - name: Verify release branch policy and imported history
        if: steps.batch.outputs.proceed == 'true'
        run: |
          node tools/tests/test_release_policy.cjs
          python3 tools/verify_import_history.py
      - if: steps.batch.outputs.proceed == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Require the exact durable dependency bundle before versioning
        if: steps.batch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if tools/release/install_dependency_bundle.sh; then
              exit 0
            fi
            if test "${attempt}" -eq 10; then
              echo "durable dependency bundle is unavailable after 10 attempts; run Publish Dependency Bundle on current main" >&2
              exit 1
            fi
            sleep 30
          done
      - id: current
        name: Rebind release mutation to the current release branch
        if: steps.batch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.batch.outputs.branch }}
          RELEASE_TRIGGER_SHA: ${{ steps.batch.outputs.revision }}
        run: >-
          python3 tools/release/select_release_batch.py --recheck
          --branch "${RELEASE_BRANCH}" --revision "${RELEASE_TRIGGER_SHA}"
          --github-output "${GITHUB_OUTPUT}"
      - id: pending-release
        name: Detect an incomplete semantic release
        if: steps.current.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/release/resolve_pending_release.py \
            --repository "${RELEASE_REPOSITORY}" \
            --branch "${ATRINIK_RELEASE_BRANCH}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Delete the policy-listed empty failed draft
        if: env.ATRINIK_RELEASE_SUPERSEDED != 'true' && steps.pending-release.outputs.action == 'delete-empty-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.pending-release.outputs.release_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.pending-release.outputs.tag }}
        run: |
          if test "${ATRINIK_RELEASE_SUPERSEDED:-false}" = true; then exit 0; fi
          python3 tools/release/select_release_batch.py --recheck --require-current \
            --branch "${ATRINIK_RELEASE_BRANCH}" --revision "$(git rev-parse HEAD)" \
            --github-output "${GITHUB_OUTPUT}" || {
              status=$?
              if test "${status}" -eq 3; then
                echo 'ATRINIK_RELEASE_SUPERSEDED=true' >> "${GITHUB_ENV}"
                exit 0
              fi
              exit "${status}"
            }
          set -euo pipefail
          python3 tools/release/resolve_pending_release.py \
            --repository "${RELEASE_REPOSITORY}" \
            --branch "${ATRINIK_RELEASE_BRANCH}" \
            --delete-policy-listed-empty-draft \
            --expected-tag "${RELEASE_TAG}" \
            --expected-release-id "${RELEASE_ID}"
      - name: Resume the incomplete package release
        if: env.ATRINIK_RELEASE_SUPERSEDED != 'true' && steps.pending-release.outputs.action == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.pending-release.outputs.tag }}
        run: |
          if test "${ATRINIK_RELEASE_SUPERSEDED:-false}" = true; then exit 0; fi
          python3 tools/release/select_release_batch.py --recheck --require-current \
            --branch "${ATRINIK_RELEASE_BRANCH}" --revision "$(git rev-parse HEAD)" \
            --github-output "${GITHUB_OUTPUT}" || {
              status=$?
              if test "${status}" -eq 3; then
                echo 'ATRINIK_RELEASE_SUPERSEDED=true' >> "${GITHUB_ENV}"
                exit 0
              fi
              exit "${status}"
            }
          gh workflow run package-release.yml \
            --repo "${RELEASE_REPOSITORY}" \
            --ref "${ATRINIK_RELEASE_BRANCH}" \
            --field "tag=${RELEASE_TAG}" \
            --field "source_branch=${ATRINIK_RELEASE_BRANCH}"
      - name: Resume the retained complete candidate
        if: env.ATRINIK_RELEASE_SUPERSEDED != 'true' && steps.pending-release.outputs.action == 'resume-retained-candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.pending-release.outputs.candidate_run_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.pending-release.outputs.tag }}
        run: |
          if test "${ATRINIK_RELEASE_SUPERSEDED:-false}" = true; then exit 0; fi
          python3 tools/release/select_release_batch.py --recheck --require-current \
            --branch "${ATRINIK_RELEASE_BRANCH}" --revision "$(git rev-parse HEAD)" \
            --github-output "${GITHUB_OUTPUT}" || {
              status=$?
              if test "${status}" -eq 3; then
                echo 'ATRINIK_RELEASE_SUPERSEDED=true' >> "${GITHUB_ENV}"
                exit 0
              fi
              exit "${status}"
            }
          set -euo pipefail
          [[ ${CANDIDATE_RUN_ID} =~ ^[1-9][0-9]*$ ]]
          [[ ${RELEASE_TAG} =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh workflow run package-release.yml \
            --repo "${RELEASE_REPOSITORY}" \
            --ref main \
            --field "tag=${RELEASE_TAG}" \
            --field "candidate_run_id=${CANDIDATE_RUN_ID}"
      - name: Record pending release recovery disposition
        if: steps.pending-release.outputs.failure_class != ''
        env:
          RELEASE_ACTION: ${{ steps.pending-release.outputs.action }}
          RELEASE_FAILURE_CLASS: ${{ steps.pending-release.outputs.failure_class }}
          RELEASE_RETRY_COUNT: ${{ steps.pending-release.outputs.retry_count || '0' }}
        run: |
          {
            echo "### Pending release recovery disposition"
            echo "- action: \`${RELEASE_ACTION}\`"
            echo "- failure class: \`${RELEASE_FAILURE_CLASS}\`"
            echo "- consecutive matching failures inspected: \`${RELEASE_RETRY_COUNT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Analyze commits, tag, and publish release notes
        if: >-
          env.ATRINIK_RELEASE_SUPERSEDED != 'true' &&
          (steps.pending-release.outputs.action == 'none' ||
          steps.pending-release.outputs.action == 'delete-empty-draft')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "${ATRINIK_RELEASE_SUPERSEDED:-false}" = true; then exit 0; fi
          python3 tools/release/select_release_batch.py --recheck --require-current \
            --branch "${ATRINIK_RELEASE_BRANCH}" --revision "$(git rev-parse HEAD)" \
            --github-output "${GITHUB_OUTPUT}" || {
              status=$?
              if test "${status}" -eq 3; then
                echo 'ATRINIK_RELEASE_SUPERSEDED=true' >> "${GITHUB_ENV}"
                exit 0
              fi
              exit "${status}"
            }
          export GITHUB_REF="refs/heads/${ATRINIK_RELEASE_BRANCH}"
          export GITHUB_REF_NAME="${ATRINIK_RELEASE_BRANCH}"
          release_commit=$(git rev-parse HEAD)
          export GITHUB_SHA="${release_commit}"
          npx --yes \
            --package=semantic-release@25.0.9 \
            --package=@semantic-release/commit-analyzer@13.0.1 \
            --package=@semantic-release/release-notes-generator@14.1.1 \
            --package=@semantic-release/exec@7.1.0 \
            --package=conventional-changelog-conventionalcommits@9.3.1 \
            node tools/release/run_semantic_release.mjs
