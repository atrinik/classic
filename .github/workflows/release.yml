name: Semantic Release

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write

concurrency:
  group: classic-release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the default-branch workflow definition
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          if test "${RELEASE_EVENT}" = workflow_run; then
            test -n "${RELEASE_TRIGGER_SHA}"
          fi
      - name: Check out the validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Require the validated current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          commit=$(git rev-parse HEAD)
          test "${commit}" = "$(git rev-parse refs/remotes/origin/main)"
          if test "${RELEASE_EVENT}" = workflow_run; then
            test "${commit}" = "${RELEASE_TRIGGER_SHA}"
          fi
          successful=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${RELEASE_REPOSITORY}/commits/${commit}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "Classic validation" and .conclusion == "success" and .app.id == 15368)] | length')
          test "${successful}" -ge 1
          python3 tools/verify_import_history.py
      - id: pending-release
        name: Detect an incomplete semantic release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/release/resolve_pending_release.py \
            --repository "${RELEASE_REPOSITORY}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Delete the policy-listed empty failed draft
        if: steps.pending-release.outputs.action == 'delete-empty-draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.pending-release.outputs.release_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.pending-release.outputs.tag }}
        run: |
          set -euo pipefail
          verification=$(python3 tools/release/resolve_pending_release.py \
            --repository "${RELEASE_REPOSITORY}")
          expected="{\"action\": \"delete-empty-draft\", \"release_id\": \"${RELEASE_ID}\", \"tag\": \"${RELEASE_TAG}\"}"
          test "${verification}" = "${expected}"
          gh api --method DELETE \
            "repos/${RELEASE_REPOSITORY}/releases/${RELEASE_ID}"
      - name: Resume the incomplete package release
        if: steps.pending-release.outputs.action == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.pending-release.outputs.tag }}
        run: >-
          gh workflow run package-release.yml
          --repo "${RELEASE_REPOSITORY}"
          --ref main
          --field "tag=${RELEASE_TAG}"
      - name: Analyze commits, tag, and publish release notes
        if: steps.pending-release.outputs.action != 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/commit-analyzer@13.0.1
          --package=@semantic-release/release-notes-generator@14.1.1
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          node tools/release/run_semantic_release.mjs
