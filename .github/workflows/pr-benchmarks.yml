name: Requested PR benchmarks

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: classic-pr-benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLASSIC_LINUX_IMAGE: ghcr.io/atrinik/classic-build:1.2.3@sha256:d0ec0a31f97fa1d699f62b81bbe697d95b335f44f1c99fde8704dfc528e2102f
  CLASSIC_LINUX_IMAGE_DIGEST: sha256:d0ec0a31f97fa1d699f62b81bbe697d95b335f44f1c99fde8704dfc528e2102f
  CLASSIC_LINUX_CCACHE_COMPILER: gcc-15.2.0
  CLASSIC_LINUX_CCACHE_EPOCH: "1"

jobs:
  changes:
    name: Benchmark request and path classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      requested: ${{ steps.classify.outputs.requested }}
      client: ${{ steps.classify.outputs.benchmark_client }}
      server: ${{ steps.classify.outputs.benchmark_server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Honor the current request label and select benchmark suites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED: "${{ contains(github.event.pull_request.labels.*.name, 'ci: benchmark') }}"
        run: |
          if test "${REQUESTED}" = true; then
            printf 'requested=true\n' >>"${GITHUB_OUTPUT}"
            python3 tools/ci/classify_changes.py \
              --event pull_request \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}" \
              --github-output "${GITHUB_OUTPUT}" \
              --codeql-config build/codeql-unused.yml
          elif test "${REQUESTED}" = false; then
            printf '%s\n' \
              'requested=false' \
              'benchmark_client=false' \
              'benchmark_server=false' \
              >>"${GITHUB_OUTPUT}"
          else
            echo "invalid benchmark request state: ${REQUESTED}" >&2
            exit 2
          fi

  dependency-inputs:
    name: Benchmark dependency inputs
    needs: changes
    if: >-
      needs.changes.outputs.requested == 'true' &&
      (needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: dependency-key
        name: Resolve complete immutable input key
        run: |
          python3 server/tools/dependencies.py bundle-key \
            --client-lock client/dependencies.lock.json \
            --server-lock server/dependencies.lock.json \
            --source-lock server/cmake/immutable_sources.lock.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-dependency-archives
          key: classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}
          restore-keys: >-
            classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}-
      - id: dependency-stage
        name: Acquire and verify complete immutable input bundle
        run: |
          python3 server/tools/dependencies.py bundle-stage \
            --client-lock client/dependencies.lock.json \
            --server-lock server/dependencies.lock.json \
            --source-lock server/cmake/immutable_sources.lock.json \
            --cache "${RUNNER_TEMP}/classic-dependency-archives" \
            --output build/dependency-inputs \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.dependency-stage.outputs.cache_changed == 'true'
        with:
          path: ${{ runner.temp }}/classic-dependency-archives
          key: >-
            classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-benchmark-dependency-inputs
          path: build/dependency-inputs
          if-no-files-found: error
          retention-days: 1

  client:
    name: Requested client benchmarks
    needs: [changes, dependency-inputs]
    if: needs.changes.outputs.requested == 'true' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind the benchmark to the latest pull-request head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-benchmark-dependency-inputs
          path: build/dependency-inputs
      - id: linux-cache
        name: Resolve isolated client benchmark compiler cache key
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/linux_cache_key.py \
            --component client \
            --event pull_request \
            --ref "${GITHUB_REF}" \
            --pr-number "${PR_NUMBER}" \
            --commit "${HEAD_SHA}" \
            --image-digest "${CLASSIC_LINUX_IMAGE_DIGEST}" \
            --compiler "${CLASSIC_LINUX_CCACHE_COMPILER}" \
            --epoch "${CLASSIC_LINUX_CCACHE_EPOCH}" \
            --material .github/workflows/pr-benchmarks.yml \
            --material tools/ci/run_linux_check.sh \
            --material client/CMakeLists.txt \
            --material client/CMakePresets.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-ccache/client-benchmark
          key: ${{ steps.linux-cache.outputs.key }}
          restore-keys: ${{ steps.linux-cache.outputs.restore_prefix }}
      - name: Pull pinned Classic Linux environment
        run: docker pull "${CLASSIC_LINUX_IMAGE}"
      - name: Prepare isolated client benchmark compiler cache
        run: |
          mkdir -p "${RUNNER_TEMP}/classic-ccache/client-benchmark"
          chmod 1777 "${RUNNER_TEMP}/classic-ccache/client-benchmark"
      - name: Build and compare the selected client probes
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env HOME=/tmp/classic-home \
            --env ATRINIK_BENCHMARK_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            --env ATRINIK_BENCHMARK_REVISION="${{ github.event.pull_request.head.sha }}" \
            --env ATRINIK_MOVEMENT_EVENT_NAME=pull_request \
            --env ATRINIK_MOVEMENT_MATRIX=fast \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache/client-benchmark:/cache/ccache" \
            --workdir /workspace \
            "${CLASSIC_LINUX_IMAGE}" \
            tools/ci/run_linux_check.sh client-benchmark /workspace
      - name: Render client benchmark summary
        if: always()
        env:
          CLIENT_RESULT: ${{ job.status }}
        run: |
          python3 client/tools/benchmark_movement_regression.py render-comment \
            --input build/ci-evidence/movement-frame-time.json \
            --client-result "${CLIENT_RESULT}" \
            --baseline-schema build/ci-evidence/movement-baseline-schema.py \
            --output build/ci-evidence/movement-comment.md
          cat build/ci-evidence/movement-comment.md >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pr-client-benchmark-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: build/ci-evidence
          if-no-files-found: error
          retention-days: 14

  server:
    name: Requested server content benchmark
    needs: [changes, dependency-inputs]
    if: needs.changes.outputs.requested == 'true' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Bind the benchmark to the latest pull-request head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-benchmark-dependency-inputs
          path: build/dependency-inputs
      - id: linux-cache
        name: Resolve isolated server benchmark compiler cache key
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/linux_cache_key.py \
            --component server \
            --event pull_request \
            --ref "${GITHUB_REF}" \
            --pr-number "${PR_NUMBER}" \
            --commit "${HEAD_SHA}" \
            --image-digest "${CLASSIC_LINUX_IMAGE_DIGEST}" \
            --compiler "${CLASSIC_LINUX_CCACHE_COMPILER}" \
            --epoch "${CLASSIC_LINUX_CCACHE_EPOCH}" \
            --material .github/workflows/pr-benchmarks.yml \
            --material tools/ci/run_linux_check.sh \
            --material server/CMakeLists.txt \
            --material server/CMakePresets.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-ccache/server-benchmark
          key: ${{ steps.linux-cache.outputs.key }}
          restore-keys: ${{ steps.linux-cache.outputs.restore_prefix }}
      - name: Pull pinned Classic Linux environment
        run: docker pull "${CLASSIC_LINUX_IMAGE}"
      - name: Prepare isolated server benchmark compiler cache
        run: |
          mkdir -p "${RUNNER_TEMP}/classic-ccache/server-benchmark"
          chmod 1777 "${RUNNER_TEMP}/classic-ccache/server-benchmark"
      - name: Build and compare the server content-loader probe
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env HOME=/tmp/classic-home \
            --env ATRINIK_BENCHMARK_BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            --env ATRINIK_BENCHMARK_REVISION="${{ github.event.pull_request.head.sha }}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache/server-benchmark:/cache/ccache" \
            --workdir /workspace \
            "${CLASSIC_LINUX_IMAGE}" \
            tools/ci/run_linux_check.sh server-benchmark /workspace
      - name: Publish server benchmark job summary
        if: always()
        run: |
          if test -f build/ci-evidence/server-content-benchmark-summary.md; then
            cat build/ci-evidence/server-content-benchmark-summary.md >>"${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' \
              '## Server content benchmark' \
              '' \
              'The requested server benchmark did not produce complete evidence.' \
              >>"${GITHUB_STEP_SUMMARY}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pr-server-benchmark-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: build/ci-evidence
          if-no-files-found: error
          retention-days: 14

  summary:
    name: PR benchmark request summary
    needs: [changes, client, server]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Explain the request disposition
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUESTED: ${{ needs.changes.outputs.requested }}
          CLIENT_SELECTED: ${{ needs.changes.outputs.client }}
          CLIENT_RESULT: ${{ needs.client.result }}
          SERVER_SELECTED: ${{ needs.changes.outputs.server }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          printf '%s\n' '## Requested PR benchmarks' '' >>"${GITHUB_STEP_SUMMARY}"
          if test "${CHANGES_RESULT}" != success; then
            printf '%s\n' \
              "Benchmark request classification finished with \`${CHANGES_RESULT}\`." \
              >>"${GITHUB_STEP_SUMMARY}"
          elif test "${REQUESTED}" != true; then
            printf '%s\n' \
              "Benchmarks were not requested. Add the \`ci: benchmark\` label to opt in." \
              >>"${GITHUB_STEP_SUMMARY}"
          elif test "${CLIENT_SELECTED}" != true && test "${SERVER_SELECTED}" != true; then
            printf '%s\n' \
              'The request is not applicable: no benchmark-sensitive path changed.' \
              >>"${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' \
              "- Client selected: \`${CLIENT_SELECTED}\` (\`${CLIENT_RESULT}\`)" \
              "- Server selected: \`${SERVER_SELECTED}\` (\`${SERVER_RESULT}\`)" \
              >>"${GITHUB_STEP_SUMMARY}"
          fi

  movement-comment:
    name: Requested movement regression comment
    needs: [changes, client]
    if: >-
      always() && needs.changes.outputs.requested == 'true' &&
      needs.changes.outputs.client == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: pr-client-benchmark-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: evidence
      - name: Publish one bounded pre-rendered summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          CLIENT_RESULT: ${{ needs.client.result }}
        run: |
          marker='<!-- atrinik-movement-regression-summary -->'
          if test -f evidence/movement-comment.md &&
            test "$(head -n 1 evidence/movement-comment.md)" = "${marker}" &&
            test "$(wc -c <evidence/movement-comment.md)" -le 65536; then
            cp evidence/movement-comment.md comment.md
          else
            printf '%s\n' \
              "${marker}" \
              '## Movement regression summary' \
              '' \
              "Requested evidence is unavailable because the client benchmark finished with \`${CLIENT_RESULT}\`." \
              >comment.md
          fi
          comment_id=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" |
            sed -n '1p')
          if test -n "${comment_id}"; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              --raw-field body="$(<comment.md)" >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --raw-field body="$(<comment.md)" >/dev/null
          fi
