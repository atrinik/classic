name: Package Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unified semantic-release tag to package
        required: true
        type: string
      candidate_run_id:
        description: Failed Package Release run with a retained complete candidate
        required: false
        type: string

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  packages: read

concurrency:
  group: classic-release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Bind workflow definition to release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: write
    outputs:
      commit: ${{ steps.metadata.outputs.commit || steps.retained.outputs.commit }}
      source_epoch: ${{ steps.metadata.outputs.source_epoch || steps.retained.outputs.source_epoch }}
      tag: ${{ steps.metadata.outputs.tag || steps.retained.outputs.tag }}
      version: ${{ steps.metadata.outputs.version || steps.retained.outputs.version }}
    steps:
      - name: Check out the current main recovery definition
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Check out the immutable release tag
        if: github.ref_type == 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Require an immutable tag or validated main recovery definition
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          [[ ${RELEASE_TAG} =~ ^v5\.[0-9]+\.[0-9]+$ ]]
          if test "${RELEASE_REF_TYPE}" = tag; then
            test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"
          else
            test "${RELEASE_REF_TYPE}" = branch
            test "${GITHUB_REF}" = refs/heads/main
            test "$(git rev-parse HEAD)" = "${RELEASE_WORKFLOW_SHA}"
            test "$(git rev-parse refs/remotes/origin/main)" = \
              "${RELEASE_WORKFLOW_SHA}"
            release_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            git merge-base --is-ancestor "${release_commit}" \
              "${RELEASE_WORKFLOW_SHA}"
            successful=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${RELEASE_REPOSITORY}/commits/${RELEASE_WORKFLOW_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Classic validation" and .conclusion == "success" and .app.id == 15368)] | length')
            test "${successful}" -ge 1
          fi
      - id: metadata
        name: Validate tag, release, checks, and ancestry
        if: inputs.candidate_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          recovery_arguments=()
          if test "${GITHUB_REF}" = refs/heads/main; then
            recovery_arguments+=(--recovery-main)
          fi
          python3 tools/release/validate_release.py \
            --tag "${RELEASE_TAG}" \
            --repository "${RELEASE_REPOSITORY}" \
            "${recovery_arguments[@]}"
      - id: retained
        name: Validate the retained complete candidate
        if: inputs.candidate_run_id != ''
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          [[ ${CANDIDATE_RUN_ID} =~ ^[1-9][0-9]*$ ]]
          run_fields=$(gh api \
            "repos/${RELEASE_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            --jq '[.name, .path, .event, .head_repository.full_name, .conclusion, .head_sha] | @tsv')
          IFS=$'\t' read -r run_name run_path run_event run_repository \
            run_conclusion run_commit <<<"${run_fields}"
          test "${run_name}" = 'Package Release'
          test "${run_path}" = '.github/workflows/package-release.yml'
          test "${run_event}" = workflow_dispatch
          test "${run_repository}" = "${RELEASE_REPOSITORY}"
          test "${run_conclusion}" = failure
          git merge-base --is-ancestor \
            "refs/tags/${RELEASE_TAG}^{commit}" "${run_commit}"
          git merge-base --is-ancestor "${run_commit}" HEAD
          finalized=$(gh api \
            "repos/${RELEASE_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.name == "Build and validate immutable candidate / Validate complete release candidate" and .conclusion == "success")] | length')
          test "${finalized}" -eq 1
          failed_publish=$(gh api \
            "repos/${RELEASE_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.name == "Publish unified release" and .conclusion == "failure")] | length')
          test "${failed_publish}" -eq 1
          candidates=$(gh api \
            "repos/${RELEASE_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "complete-release-candidate-'"${RELEASE_TAG}"'" and .expired == false and .size_in_bytes > 0 and (.digest | startswith("sha256:")))] | length')
          test "${candidates}" -eq 1
          python3 tools/release/validate_release.py \
            --tag "${RELEASE_TAG}" \
            --repository "${RELEASE_REPOSITORY}" \
            --recovery-main \
            --github-output "${GITHUB_OUTPUT}"

  discord-config:
    name: Stage Discord application configuration
    needs: preflight
    if: inputs.candidate_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: discord-release
    steps:
      - name: Validate the release-only public Application ID
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        run: |
          [[ ${DISCORD_APPLICATION_ID} =~ ^[1-9][0-9]{0,19}$ ]]
          python3 -c 'import os, sys; value = int(os.environ["DISCORD_APPLICATION_ID"]); sys.exit(0 if value <= 18446744073709551615 else 1)'
          umask 077
          mkdir -p build/discord-config
          printf '%s\n' "${DISCORD_APPLICATION_ID}" > \
            build/discord-config/discord-application-id
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: discord-application-id-${{ inputs.tag }}
          path: build/discord-config/discord-application-id
          if-no-files-found: error
          retention-days: 1

  candidate:
    name: Build and validate immutable candidate
    needs: [preflight, discord-config]
    if: >-
      always() &&
      inputs.candidate_run_id == '' &&
      needs.preflight.result == 'success' &&
      needs.discord-config.result == 'success'
    permissions:
      actions: read
      attestations: read
      checks: read
      contents: read
      packages: read
    uses: ./.github/workflows/build-release-candidate.yml
    with:
      rehearsal: false
      revision: ${{ needs.preflight.outputs.commit }}
      source_epoch: ${{ needs.preflight.outputs.source_epoch }}
      tag: ${{ inputs.tag }}
      version: ${{ needs.preflight.outputs.version }}

  publish:
    name: Publish unified release
    needs: [preflight, candidate]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.candidate.result == 'success' ||
      (needs.candidate.result == 'skipped' && inputs.candidate_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_COMMIT: ${{ needs.candidate.outputs.commit || needs.preflight.outputs.commit }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag || needs.preflight.outputs.tag }}
      RELEASE_VERSION: ${{ needs.candidate.outputs.version || needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Check out the trusted recovery verifier
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build/release-automation
          ref: ${{ github.sha }}
          sparse-checkout: tools/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          name: complete-release-candidate-${{ env.RELEASE_TAG }}
          path: build/release
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - id: release-inputs
        name: Record locked server image inputs
        run: |
          python3 tools/release/locked_inputs.py \
            --version "${RELEASE_VERSION}" \
            --component server \
            --github-output "${GITHUB_OUTPUT}"
      - id: registry
        name: Inspect the versioned server image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          python3 tools/release/check_registry_version.py \
            --organization atrinik --package classic-server \
            --tag "${RELEASE_VERSION}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Recheck candidate hashes before publication
        working-directory: build/release
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 12
          sha256sum --check SHA256SUMS
      - name: Attest downloadable artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/release/*
      - name: Attest downloadable artifact SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            build/release/*.tar.gz
            build/release/*.whl
            build/release/*.zip
          sbom-path: build/release/atrinik-classic-${{ env.RELEASE_VERSION }}.spdx.json
      - id: assets
        name: Resume draft assets or verify the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 tools/release/sync_release_assets.py \
            --directory build/release \
            --repository "${RELEASE_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Refuse a published release with a missing image
        if: >-
          steps.assets.outputs.state == 'published' &&
          steps.registry.outputs.exists != 'true'
        run: |
          echo "published immutable release has no versioned server image" >&2
          exit 1
      - name: Refuse retained-candidate recovery with a missing image
        if: >-
          inputs.candidate_run_id != '' &&
          steps.registry.outputs.exists != 'true'
        run: |
          echo "retained candidate has no matching versioned server image" >&2
          exit 1
      - name: Install the exact durable dependency bundle for the server image
        if: >-
          steps.assets.outputs.state == 'draft' &&
          steps.registry.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/install_dependency_bundle.sh
      - name: Build and publish immutable server image
        id: image
        if: >-
          steps.assets.outputs.state == 'draft' &&
          steps.registry.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: ATRINIK_PACKAGE_VERSION=${{ env.RELEASE_VERSION }}
          cache-from: type=gha,scope=classic-server
          cache-to: type=gha,mode=max,scope=classic-server
          context: .
          file: server/Dockerfile
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Atrinik Classic Server
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            ${{ steps.release-inputs.outputs.labels }}
          provenance: mode=max
          push: true
          sbom: true
          tags: ghcr.io/atrinik/classic-server:${{ needs.candidate.outputs.version }}
      - name: Verify the exact image, labels, provenance, and SBOM
        env:
          IMAGE: ghcr.io/atrinik/classic-server:${{ env.RELEASE_VERSION }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.registry.outputs.digest }}
        run: |
          test -n "${IMAGE_DIGEST}"
          docker pull "${IMAGE}@${IMAGE_DIGEST}"
          verifier=tools/release/locked_inputs.py
          if test '${{ github.ref }}' = refs/heads/main; then
            verifier=build/release-automation/tools/release/locked_inputs.py
          fi
          python3 "${verifier}" \
            --version "${RELEASE_VERSION}" \
            --component server \
            --verify-image "${IMAGE}" \
            --revision "${RELEASE_COMMIT}" \
            --digest "${IMAGE_DIGEST}" \
            --root "${GITHUB_WORKSPACE}"
      - name: Attest the exact published server image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/atrinik/classic-server
          subject-digest: ${{ steps.image.outputs.digest || steps.registry.outputs.digest }}
          push-to-registry: true
      - name: Verify the GitHub server-image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.registry.outputs.digest }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          gh attestation verify
          "oci://ghcr.io/atrinik/classic-server@${IMAGE_DIGEST}"
          --repo "${RELEASE_REPOSITORY}"
      - id: final-assets
        name: Recheck the exact release assets immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 tools/release/sync_release_assets.py \
            --directory build/release \
            --repository "${RELEASE_REPOSITORY}" \
            --tag "${RELEASE_TAG}" \
            --verify-only \
            --github-output "${GITHUB_OUTPUT}"
      - name: Publish the complete draft release
        if: steps.final-assets.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release edit "${RELEASE_TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --draft=false
      - name: Verify the published immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          for attempt in {1..6}; do
            if python3 tools/release/sync_release_assets.py \
                --directory build/release \
                --repository "${RELEASE_REPOSITORY}" \
                --tag "${RELEASE_TAG}" \
                --verify-published; then
              exit 0
            fi
            ((attempt < 6)) || exit 1
            sleep 10
          done

  queue-latest:
    name: Queue latest alias reconciliation
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Dispatch the default-branch promoter
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          gh api
          --method POST
          "repos/${RELEASE_REPOSITORY}/dispatches"
          -f event_type=promote-classic-latest
