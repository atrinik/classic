name: Package Release

on:
  workflow_call:
    inputs:
      rehearsal:
        description: Build and validate without publishing
        default: true
        required: false
        type: boolean
      revision:
        description: Commit to rehearse without publishing
        required: true
        type: string
      version:
        description: Non-production semantic version used in rehearsal artifacts
        default: 0.0.0
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Unified semantic-release tag to package
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  packages: read

concurrency:
  group: >-
    classic-package-release-${{ inputs.tag || inputs.revision || github.run_id }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate unified release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.metadata.outputs.commit || steps.rehearsal.outputs.commit }}
      latest: ${{ steps.metadata.outputs.latest || steps.rehearsal.outputs.latest }}
      source_epoch: ${{ steps.metadata.outputs.source_epoch || steps.rehearsal.outputs.source_epoch }}
      tag: ${{ steps.metadata.outputs.tag || steps.rehearsal.outputs.tag }}
      version: ${{ steps.metadata.outputs.version || steps.rehearsal.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.rehearsal && inputs.revision || inputs.tag }}
      - id: metadata
        name: Validate tag, release, checks, and ancestry
        if: inputs.rehearsal != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/release/validate_release.py
          --tag '${{ inputs.tag }}'
          --repository '${{ github.repository }}'
      - id: rehearsal
        name: Validate non-publishing rehearsal inputs
        if: inputs.rehearsal == true
        env:
          REHEARSAL_REVISION: ${{ inputs.revision }}
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          [[ ${REHEARSAL_VERSION} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse "${REHEARSAL_REVISION}^{commit}")
          test "${commit}" = "$(git rev-parse HEAD)"
          {
            echo "tag=rehearsal-${commit}"
            echo "version=${REHEARSAL_VERSION}"
            echo "commit=${commit}"
            echo "source_epoch=$(git show -s --format=%ct "${commit}")"
            echo "latest=false"
          } >>"${GITHUB_OUTPUT}"

  sources:
    name: Build deterministic source packages
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - run: >-
          python3 tools/release/package_sources.py
          --version '${{ needs.metadata.outputs.version }}'
          --revision '${{ needs.metadata.outputs.commit }}'
          --output build/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sources-${{ needs.metadata.outputs.tag }}
          path: build/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  protocol-wheel:
    name: Build protocol wheel
    needs: [metadata, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sources-${{ needs.metadata.outputs.tag }}
          path: build/sources
      - name: Build wheel from the scoped source package
        run: |
          python3 -m pip install build==1.3.0
          python3 tools/release/build_protocol_wheel.py \
            --version '${{ needs.metadata.outputs.version }}' \
            --source 'build/sources/atrinik-classic-protocol-${{ needs.metadata.outputs.version }}.tar.gz' \
            --source-epoch '${{ needs.metadata.outputs.source_epoch }}' \
            --output build/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-protocol-${{ needs.metadata.outputs.tag }}
          path: build/release/*.whl
          if-no-files-found: error
          retention-days: 7

  client-windows:
    name: Build Windows client package
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: docker pull ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7
      - name: Build portable package from monorepo siblings
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env CCACHE_DIR=/workspace/client/build/ccache \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/client \
            ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7 \
            bash tools/build-windows-package.sh build/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-client-windows-${{ needs.metadata.outputs.tag }}
          path: client/build/packages/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  server-windows:
    name: Build Windows server package
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: docker pull ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7
      - name: Build portable package from monorepo siblings
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ATRINIK_PACKAGE_VERSION="${RELEASE_VERSION}" \
            --env CCACHE_DIR=/workspace/server/build/ccache \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/server \
            ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7 \
            bash tools/build-windows-package.sh build/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-server-windows-${{ needs.metadata.outputs.tag }}
          path: server/build/packages/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  server-image:
    name: Rehearse classic server image
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: ATRINIK_PACKAGE_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=classic-server
          cache-to: type=gha,mode=max,scope=classic-server
          context: .
          file: server/Dockerfile
          load: false
          push: false
          tags: ghcr.io/atrinik/classic-server:${{ needs.metadata.outputs.version }}

  publish:
    name: Publish unified release
    if: inputs.rehearsal != true
    needs:
      - metadata
      - sources
      - protocol-wheel
      - client-windows
      - server-windows
      - server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*-${{ needs.metadata.outputs.tag }}
          path: build/release
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Refuse duplicate assets and image versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          assets=$(gh api "repos/${RELEASE_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets | length')
          test "${assets}" -eq 0
          if docker buildx imagetools inspect \
              "ghcr.io/atrinik/classic-server:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Versioned classic server image already exists; refusing overwrite" >&2
            exit 1
          fi
      - name: Validate and index every downloadable artifact
        run: >-
          python3 tools/release/finalize_artifacts.py
          --version '${{ needs.metadata.outputs.version }}'
          --revision '${{ needs.metadata.outputs.commit }}'
          --source-epoch '${{ needs.metadata.outputs.source_epoch }}'
          --directory build/release
      - name: Attest downloadable artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/release/*
      - name: Attest downloadable artifact SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: build/release/*
          sbom-path: build/release/atrinik-classic-${{ needs.metadata.outputs.version }}.spdx.json
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t assets < <(find build/release -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 12
          gh release upload "${RELEASE_TAG}" "${assets[@]}"
      - name: Build and publish immutable server image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          build-args: ATRINIK_PACKAGE_VERSION=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=classic-server
          cache-to: type=gha,mode=max,scope=classic-server
          context: .
          file: server/Dockerfile
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Atrinik Classic Server
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          provenance: mode=max
          push: true
          sbom: true
          tags: ghcr.io/atrinik/classic-server:${{ needs.metadata.outputs.version }}
      - name: Update latest image alias
        if: needs.metadata.outputs.latest == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          docker buildx imagetools create
          --tag ghcr.io/atrinik/classic-server:latest
          "ghcr.io/atrinik/classic-server@${IMAGE_DIGEST}"

  rehearsal:
    name: Validate complete release rehearsal
    if: inputs.rehearsal == true
    needs:
      - metadata
      - sources
      - protocol-wheel
      - client-windows
      - server-windows
      - server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*-${{ needs.metadata.outputs.tag }}
          path: build/release
          merge-multiple: true
      - name: Validate and index the complete candidate
        run: >-
          python3 tools/release/finalize_artifacts.py
          --version '${{ needs.metadata.outputs.version }}'
          --revision '${{ needs.metadata.outputs.commit }}'
          --source-epoch '${{ needs.metadata.outputs.source_epoch }}'
          --directory build/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-release-rehearsal-${{ needs.metadata.outputs.commit }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
