name: Publish Dependency Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_missing_package:
        description: Create the exact initial package when it does not exist
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: classic-dependency-bundle-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact verified OCI layout
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Bind publication to exact current main
        env:
          PUBLICATION_SHA: ${{ github.sha }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${PUBLICATION_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${PUBLICATION_SHA}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the exact descriptor-pinned OCI layout
        run: |
          python3 tools/release/dependency_bundle.py build \
            --cache build/dependency-bundle-cache \
            --output build/dependency-bundle-oci
      - name: Install the digest-pinned registry copy client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/oras
          gh api -H 'Accept: application/octet-stream' \
            repos/oras-project/oras/releases/assets/472780866 \
            > build/oras/oras.tar.gz
          echo '9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59  build/oras/oras.tar.gz' \
            | sha256sum --check
          tar -xzf build/oras/oras.tar.gz -C build/oras oras
          test "$(build/oras/oras version | head -n 1)" = 'Version:        1.3.3'
      - id: material-tag
        name: Audit the immutable material tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(python3 tools/release/dependency_bundle.py show --field image)
          tag=$(python3 tools/release/dependency_bundle.py show --field tag)
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER}/"
          package=${image#"${prefix}"}
          test "${package}" != "${image}"
          python3 tools/release/check_registry_version.py \
            --organization "${GITHUB_REPOSITORY_OWNER}" \
            --package "${package}" \
            --tag "${tag}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Authenticate only for package publication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | build/oras/oras login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
      - id: publish
        name: Publish or verify the immutable material tag
        env:
          ALLOW_MISSING_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_missing_package && 'true' || 'false' }}
          EXISTING_DIGEST: ${{ steps.material-tag.outputs.digest }}
          PACKAGE_EXISTS: ${{ steps.material-tag.outputs.package_exists }}
          TAG_EXISTS: ${{ steps.material-tag.outputs.exists }}
        run: |
          image=$(python3 tools/release/dependency_bundle.py show --field image)
          tag=$(python3 tools/release/dependency_bundle.py show --field tag)
          digest=$(python3 tools/release/dependency_bundle.py show --field digest)
          case "${PACKAGE_EXISTS}:${TAG_EXISTS}" in
            true:true)
              if test "${EXISTING_DIGEST}" != "${digest}"; then
                echo "immutable dependency material tag exists at ${EXISTING_DIGEST}, expected ${digest}" >&2
                exit 1
              fi
              ;;
            true:false)
              test -z "${EXISTING_DIGEST}"
              build/oras/oras cp --from-oci-layout \
                "build/dependency-bundle-oci:${tag}" "${image}:${tag}"
              ;;
            false:false)
              if test "${ALLOW_MISSING_PACKAGE}" != true; then
                echo "dependency bundle package is missing; use the documented recovery path" >&2
                exit 1
              fi
              test -z "${EXISTING_DIGEST}"
              test "${tag}" = materials-428265fcc11e9e3f7fc534659b55008cd26e9da6c74da054074279b7bc4af2e9
              test "${digest}" = sha256:ffe1fa8d28a323d502d01400e2260b7b5eec37842e762c439b88bd9ee823923e
              build/oras/oras cp --from-oci-layout \
                "build/dependency-bundle-oci:${tag}" "${image}:${tag}"
              ;;
            *)
              echo "invalid material-tag audit result: package=${PACKAGE_EXISTS} tag=${TAG_EXISTS}" >&2
              exit 1
              ;;
          esac
          published=$(build/oras/oras resolve "${image}:${tag}")
          test "${published}" = "${digest}"
          {
            echo "image=${image}"
            echo "digest=${digest}"
          } >>"${GITHUB_OUTPUT}"
      - name: Attest the exact published dependency bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify the GitHub OCI attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify
          "oci://${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}"
          --repo "${GITHUB_REPOSITORY}"
