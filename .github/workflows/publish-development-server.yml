name: Publish Development Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Immutable source tags and the discovery alias share one writer. A new main
# push queues; it never cancels a run between image publication and attestation.
concurrency:
  group: classic-development-server-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate development source publication
    if: github.repository == 'atrinik/classic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require successful checks for exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
        run: python3 tools/release/development_server.py preflight --revision "${SOURCE_REVISION}" --wait
      - name: Validate imported source history
        run: python3 tools/verify_import_history.py

  publish:
    name: Publish and attest development source image
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: read
      id-token: write
      packages: write
    env:
      SOURCE_REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: registry
        name: Audit immutable source tag and current main
        run: >-
          python3 tools/release/development_server.py audit
          --revision "${SOURCE_REVISION}" --github-output "${GITHUB_OUTPUT}"
      - name: Verify an existing immutable source publication
        if: steps.registry.outputs.exists == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest }}
        run: >-
          python3 tools/release/development_server.py verify
          --revision "${SOURCE_REVISION}" --digest "${IMAGE_DIGEST}"
      - name: Acquire and verify the exact durable dependency bundle
        if: steps.registry.outputs.exists == 'false'
        run: tools/release/install_dependency_bundle.sh
      - id: inputs
        name: Record locked server image inputs
        if: steps.registry.outputs.exists == 'false'
        run: >-
          python3 tools/release/locked_inputs.py --version 0.0.0
          --component server --github-output "${GITHUB_OUTPUT}"
      - name: Recheck current main before the image build
        if: steps.registry.outputs.exists == 'false'
        run: python3 tools/release/development_server.py preflight --revision "${SOURCE_REVISION}"
      - id: image
        name: Build the immutable development source image
        if: steps.registry.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          build-args: |
            ATRINIK_PACKAGE_VERSION=0.0.0
            ATRINIK_SOURCE_REVISION=${{ github.sha }}
            ATRINIK_SOURCE_DIRTY=false
          cache-from: type=gha,scope=classic-server-development
          cache-to: type=gha,mode=max,scope=classic-server-development
          labels: |
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/atrinik/classic
            org.opencontainers.image.title=Atrinik Classic Server
            org.opencontainers.image.version=0.0.0
            org.atrinik.release-channel=development
            ${{ steps.inputs.outputs.labels }}
          provenance: mode=max
          sbom: true
          push: true
          tags: ghcr.io/atrinik/classic-server:source-${{ github.sha }}
      - name: Verify the newly built digest, source, locked inputs, SLSA and SPDX
        if: steps.registry.outputs.exists == 'false'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          python3 tools/release/development_server.py verify
          --revision "${SOURCE_REVISION}" --digest "${IMAGE_DIGEST}"
          --before-attestation
      - name: Attest only this run's newly built image index
        if: steps.registry.outputs.exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/atrinik/classic-server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify provenance and promote only the checked development digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.registry.outputs.digest }}
        run: >-
          python3 tools/release/development_server.py promote
          --revision "${SOURCE_REVISION}" --digest "${IMAGE_DIGEST}"
      - name: Record immutable publication identity
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest || steps.registry.outputs.digest }}
        run: |
          {
            echo '### Development source publication'
            echo "Source: ${SOURCE_REVISION}"
            echo "Image: ghcr.io/atrinik/classic-server@${IMAGE_DIGEST}"
            echo 'Package version: 0.0.0; channel: development'
          } >>"${GITHUB_STEP_SUMMARY}"
