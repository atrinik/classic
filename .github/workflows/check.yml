name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read
  id-token: write

concurrency:
  group: classic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      client: ${{ steps.classify.outputs.client }}
      server: ${{ steps.classify.outputs.server }}
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        name: Select native validation jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci/classify_changes.py \
            --event "${EVENT_NAME}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --codeql-config build/codeql-unused.yml

  core:
    name: Core validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate imported history and release helpers
        run: |
          python3 tools/verify_import_history.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Validate first-parent release analysis
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/commit-analyzer@13.0.1
          --package=@semantic-release/release-notes-generator@14.1.1
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          node --test tools/tests/test_first_parent_release.mjs
      - name: Check generated bindings
        run: python3 tools/generate.py --check
        working-directory: protocol
      - name: Run generator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
        working-directory: protocol
      - name: Build and test C package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
        working-directory: protocol
      - name: Build Python wheel
        run: |
          python3 -m pip install build==1.3.0
          python3 ../tools/release/package_sources.py \
            --version 0.0.0 --revision HEAD --scope protocol \
            --output build/package-source
          python3 ../tools/release/build_protocol_wheel.py \
            --version 0.0.0 \
            --source build/package-source/atrinik-classic-protocol-0.0.0.tar.gz \
            --source-epoch "$(git show -s --format=%ct HEAD)" \
            --output build/wheel
        working-directory: protocol
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcovr libcurl4-openssl-dev libssl-dev zlib1g-dev
      - name: Configure sibling protocol
        run: cmake --preset linux-coverage -DATRINIK_PROTOCOL_SOURCE_DIR="$GITHUB_WORKSPACE/protocol"
        working-directory: libatrinik
      - name: Build, test, and cover
        run: |
          cmake --build --preset linux-coverage --parallel
          ctest --preset linux-coverage
          gcovr --root . --filter '.*\.c$' --exclude '.*/tests/.*' \
            --exclude '.*/build/.*' --print-summary --xml coverage.xml
        working-directory: libatrinik
      - name: Validate installed consumer
        run: |
          cmake -S . -B build/release -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -DATRINIK_PROTOCOL_SOURCE_DIR="$GITHUB_WORKSPACE/protocol"
          cmake --build build/release --parallel
          cmake --install build/release
          cmake -S tests/consumer -B build/consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/install"
          cmake --build build/consumer --parallel
          build/consumer/libatrinik-consumer
        working-directory: libatrinik
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: libatrinik/coverage.xml
          flags: libatrinik
          use_oidc: true
      - name: Validate editor packaging helper
        run: |
          bash -n editor/build.sh
          shellcheck editor/build.sh

  windows-test-build:
    name: Build native Windows tests
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull pinned Windows build environment
        run: docker pull ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7
      - name: Cross-build and stage standalone tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/tmp/atrinik-libatrinik-ccache \
            --env CCACHE_TEMPDIR=/tmp/atrinik-libatrinik-ccache-tmp \
            --env CCACHE_MAXSIZE=250M \
            --env PATH=/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ghcr.io/atrinik/windows-build:1.0.5@sha256:9cc373f620a577328fc0a7a7fa823bddaca6d7dc75ac73bcf21be421c49676f7 \
            bash -c '
              set -euo pipefail
              x86_64-w64-mingw32.shared-cmake \
                -S libatrinik \
                -B libatrinik/build/windows-tests \
                -G Ninja \
                -DBUILD_TESTING=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DATRINIK_PROTOCOL_SOURCE_DIR=/workspace/protocol
              cmake --build libatrinik/build/windows-tests \
                --target libatrinik-path libatrinik-rendezvous libatrinik-metaserver-publisher \
                --parallel "$(nproc)"
              stage=libatrinik/build/windows-test-bundle
              cmake -E remove_directory "${stage}"
              python3 tools/ci/stage_windows_runtime.py \
                --objdump x86_64-w64-mingw32.shared-objdump \
                --runtime-dir "${MXE_RUNTIME_DIR}" \
                --output-dir "${stage}" \
                libatrinik/build/windows-tests/libatrinik-path.exe \
                libatrinik/build/windows-tests/libatrinik-rendezvous.exe \
                libatrinik/build/windows-tests/libatrinik-metaserver-publisher.exe
              cmake -E copy_directory libatrinik/tests/fixtures "${stage}/fixtures"
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-windows-tests
          path: libatrinik/build/windows-test-bundle
          if-no-files-found: error
          retention-days: 1

  windows-test:
    name: Native Windows security tests
    needs:
      - changes
      - windows-test-build
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-windows-tests
          path: build/native-windows-tests
      - name: Execute private-state and protocol tests on Windows
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build/native-windows-tests").Path
          $env:PATH = "${bundle};${env:PATH}"

          & (Join-Path $bundle "libatrinik-path.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-path.exe failed with exit code ${LASTEXITCODE}"
          }

          $positive = Join-Path $bundle "fixtures/rendezvous-invite-v1.json"
          $negative = Join-Path $bundle "fixtures/rendezvous-invite-v1-negative.json"
          & (Join-Path $bundle "libatrinik-rendezvous.exe") $positive $negative
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-rendezvous.exe failed with exit code ${LASTEXITCODE}"
          }

          $publisher = Join-Path $bundle "fixtures/metaserver-publisher-v1.json"
          & (Join-Path $bundle "libatrinik-metaserver-publisher.exe") $publisher
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-metaserver-publisher.exe failed with exit code ${LASTEXITCODE}"
          }

  server:
    name: Server validation
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull pinned build environment
        run: docker pull ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
      - name: Validate, build, and test
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/server \
            ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03 \
            bash -euo pipefail -c '
              apt-get update -qq
              env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                build-essential ca-certificates check cmake flex gcovr \
                libcurl4-openssl-dev libgd-dev libminiupnpc-dev libreadline-dev \
                libssl-dev libsubunit-dev ninja-build pkgconf python3-dev zlib1g-dev
              python3 -m unittest discover -s tools/tests -p "test_*.py"
              python3 tools/dependencies.py sync
              python3 tools/dependencies.py verify
              cmake --preset linux-coverage \
                -DFETCHCONTENT_SOURCE_DIR_ATRINIK_PROTOCOL=/workspace/protocol \
                -DFETCHCONTENT_SOURCE_DIR_LIBATRINIK=/workspace/libatrinik
              cmake --build --preset linux-coverage --parallel
              ctest --preset linux-coverage
              gcovr --root . --filter "src/" --exclude "src/tests/" \
                --print-summary --xml coverage.xml
              cmake --preset linux-sanitizers \
                -DFETCHCONTENT_SOURCE_DIR_ATRINIK_PROTOCOL=/workspace/protocol \
                -DFETCHCONTENT_SOURCE_DIR_LIBATRINIK=/workspace/libatrinik
              cmake --build --preset linux-sanitizers --parallel
              env ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
                ctest --preset linux-sanitizers
            '
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: server/coverage.xml
          flags: server
          use_oidc: true

  client:
    name: Client validation
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: client/build/ci-prefix
          key: classic-client-sdl-mixer-ubuntu-26.04-x64-3.2.4-v1
      - name: Pull pinned build environment
        run: docker pull ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03
      - name: Validate, build, and test
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/client \
            ubuntu@sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03 \
            bash -euo pipefail -c '
              tools/install-linux-ci-dependencies.sh build/ci-prefix
              export CMAKE_PREFIX_PATH=/workspace/client/build/ci-prefix
              export LD_LIBRARY_PATH=/workspace/client/build/ci-prefix/lib
              export PKG_CONFIG_PATH=/workspace/client/build/ci-prefix/lib/pkgconfig
              python3 -m unittest discover -s tools/tests -p "test_*.py"
              python3 tools/dependencies.py sync
              python3 tools/dependencies.py verify
              cmake --preset linux-coverage \
                -DFETCHCONTENT_SOURCE_DIR_ATRINIK_PROTOCOL=/workspace/protocol \
                -DFETCHCONTENT_SOURCE_DIR_LIBATRINIK=/workspace/libatrinik
              cmake --build --preset linux-coverage --parallel
              ctest --preset linux-coverage
              gcovr --root . --filter "src/" --exclude "src/tests/" \
                --print-summary --xml coverage.xml
            '
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: client/coverage.xml
          flags: client
          use_oidc: true

  classic-validation:
    name: Classic validation
    if: always()
    needs:
      - changes
      - core
      - server
      - client
      - windows-test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected component checks
        run: |
          python3 tools/ci/require_checks.py classic \
            --classifier-result '${{ needs.changes.result }}' \
            --core-result '${{ needs.core.result }}' \
            --client-required '${{ needs.changes.outputs.client }}' \
            --client-result '${{ needs.client.result }}' \
            --server-required '${{ needs.changes.outputs.server }}' \
            --server-result '${{ needs.server.result }}' \
            --windows-required '${{ needs.changes.outputs.windows }}' \
            --windows-result '${{ needs.windows-test.result }}'
