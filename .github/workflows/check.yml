name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classic-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CLASSIC_LINUX_IMAGE: ghcr.io/atrinik/classic-build:1.2.3@sha256:d0ec0a31f97fa1d699f62b81bbe697d95b335f44f1c99fde8704dfc528e2102f
  CLASSIC_LINUX_IMAGE_DIGEST: sha256:d0ec0a31f97fa1d699f62b81bbe697d95b335f44f1c99fde8704dfc528e2102f
  CLASSIC_LINUX_CCACHE_COMPILER: gcc-15.2.0
  CLASSIC_LINUX_CCACHE_EPOCH: "1"

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      client: ${{ steps.classify.outputs.client }}
      server: ${{ steps.classify.outputs.server }}
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        name: Select native validation jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/ci/classify_changes.py \
            --event "${EVENT_NAME}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --codeql-config build/codeql-unused.yml

  dependency-inputs:
    name: Verified dependency inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: dependency-key
        name: Resolve complete immutable input key
        run: |
          python3 server/tools/dependencies.py bundle-key \
            --client-lock client/dependencies.lock.json \
            --server-lock server/dependencies.lock.json \
            --source-lock server/cmake/immutable_sources.lock.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-dependency-archives
          key: classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}
          restore-keys: >-
            classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}-
      - id: dependency-stage
        name: Acquire and verify complete immutable input bundle
        run: |
          python3 server/tools/dependencies.py bundle-stage \
            --client-lock client/dependencies.lock.json \
            --server-lock server/dependencies.lock.json \
            --source-lock server/cmake/immutable_sources.lock.json \
            --cache "${RUNNER_TEMP}/classic-dependency-archives" \
            --output build/dependency-inputs \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.dependency-stage.outputs.cache_changed == 'true'
        with:
          path: ${{ runner.temp }}/classic-dependency-archives
          key: >-
            classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: classic-dependency-inputs
          path: build/dependency-inputs
          if-no-files-found: error
          retention-days: 1

  core:
    name: Core validation
    needs: dependency-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install Python test coverage tooling
        run: python3 -m pip install coverage==7.15.3
      - name: Validate imported history and release helpers
        run: |
          python3 -m coverage run --branch --source=tools \
            tools/verify_import_history.py \
            --release-history-ref "${{ github.event_name == 'workflow_dispatch' && 'origin/main' || 'HEAD' }}"
          python3 -m coverage run --append --branch --source=tools \
            -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -m coverage xml --omit='tools/tests/*' \
            -o tools/coverage.xml
      - name: Validate first-parent release analysis
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/commit-analyzer@13.0.1
          --package=@semantic-release/release-notes-generator@14.1.1
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          node --test tools/tests/test_first_parent_release.mjs
      - name: Check generated bindings
        run: python3 tools/generate.py --check
        working-directory: protocol
      - name: Run generator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
        working-directory: protocol
      - name: Build Python wheel
        run: |
          python3 -m pip install build==1.3.0
          python3 ../tools/release/package_sources.py \
            --version 0.0.0 --revision HEAD --scope protocol \
            --output build/package-source
          python3 ../tools/release/build_protocol_wheel.py \
            --version 0.0.0 \
            --source build/package-source/atrinik-classic-protocol-0.0.0.tar.gz \
            --source-epoch "$(git show -s --format=%ct HEAD)" \
            --output build/wheel
        working-directory: protocol
      - id: linux-cache
        name: Resolve isolated core compiler cache key
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/linux_cache_key.py \
            --component core \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --pr-number "${PR_NUMBER}" \
            --commit "${GITHUB_SHA}" \
            --image-digest "${CLASSIC_LINUX_IMAGE_DIGEST}" \
            --compiler "${CLASSIC_LINUX_CCACHE_COMPILER}" \
            --epoch "${CLASSIC_LINUX_CCACHE_EPOCH}" \
            --material .github/workflows/check.yml \
            --material tools/ci/run_linux_check.sh \
            --material protocol/CMakeLists.txt \
            --material libatrinik/CMakeLists.txt \
            --material libatrinik/CMakePresets.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-ccache/core
          key: ${{ steps.linux-cache.outputs.key }}
          restore-keys: ${{ steps.linux-cache.outputs.restore_prefix }}
      - name: Measure and pull pinned Classic Linux environment
        run: tools/ci/measure_linux_image.sh "${CLASSIC_LINUX_IMAGE}" build/ci-evidence
      - name: Prepare stable core compiler cache mount
        run: |
          mkdir -p "${RUNNER_TEMP}/classic-ccache/core"
          chmod 1777 "${RUNNER_TEMP}/classic-ccache/core"
      - name: Build and test core packages in the pinned environment
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env HOME=/tmp/classic-home \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache/core:/cache/ccache" \
            --workdir /workspace \
            "${CLASSIC_LINUX_IMAGE}" \
            tools/ci/run_linux_check.sh core /workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linux-core-evidence-${{ github.run_attempt }}
          path: build/ci-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Upload release-tool coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: tools/coverage.xml
          flags: release-tools
          use_oidc: true
      - name: Upload libatrinik coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: libatrinik/coverage.xml
          flags: libatrinik
          use_oidc: true
      - name: Validate editor packaging helper
        run: |
          bash -n editor/build.sh
          shellcheck editor/build.sh

  windows-test-build:
    name: Build native Windows tests
    needs: [changes, dependency-inputs]
    if: needs.changes.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: classic-dependency-inputs
          path: build/dependency-inputs
      - name: Verify and stage deterministic package inputs offline
        run: |
          python3 server/tools/dependencies.py bundle-verify \
            --client-lock client/dependencies.lock.json \
            --server-lock server/dependencies.lock.json \
            --source-lock server/cmake/immutable_sources.lock.json \
            --bundle build/dependency-inputs
          python3 client/tools/dependencies.py sync --root client \
            --cache build/dependency-inputs/downloads --refresh --offline
          python3 server/tools/dependencies.py sync --root server \
            --cache build/dependency-inputs/downloads --refresh --offline
          source="$(python3 server/tools/dependencies.py source \
            --source-lock server/cmake/immutable_sources.lock.json \
            --source-name libpcpnatpmp \
            --cache build/dependency-source-cache \
            --downloads build/dependency-inputs/downloads \
            --offline)"
          printf '%s\n' "${source}" > build/libpcpnatpmp-source-path
          umask 077
          printf '%s\n' '111111111111111111' > client/data/discord-application-id
          printf '%s\n' '123456789012345678' > \
            build/discord-test-application-id
      - name: Pull pinned Windows build environment
        run: docker pull ghcr.io/atrinik/windows-build:1.2.1@sha256:d1f082eb28891600a9cf018a1d4310b9f3e1f985f82139fa48fbd4ac77b623bb
      - name: Cross-build and stage standalone tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/tmp/atrinik-libatrinik-ccache \
            --env CCACHE_TEMPDIR=/tmp/atrinik-libatrinik-ccache-tmp \
            --env CCACHE_MAXSIZE=250M \
            --env ATRINIK_PACKAGE_VERSION=0.0.0 \
            --env ATRINIK_DISCORD_APPLICATION_ID_FILE=/workspace/build/discord-test-application-id \
            --env PATH=/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ghcr.io/atrinik/windows-build:1.2.1@sha256:d1f082eb28891600a9cf018a1d4310b9f3e1f985f82139fa48fbd4ac77b623bb \
            bash -c '
              set -euo pipefail
              pcpnatpmp_source="$(cat build/libpcpnatpmp-source-path)"
              pcpnatpmp_mingw_source=build/libpcpnatpmp-mingw-source
              test ! -e "${pcpnatpmp_mingw_source}"
              cmake -E copy_directory "${pcpnatpmp_source}" "${pcpnatpmp_mingw_source}"
              x86_64-w64-mingw32.shared-cmake \
                -S libatrinik \
                -B libatrinik/build/windows-tests \
                -G Ninja \
                -DBUILD_TESTING=ON \
                -DCMAKE_BUILD_TYPE=Release \
                -DATRINIK_PROTOCOL_SOURCE_DIR=/workspace/protocol
              cmake --build libatrinik/build/windows-tests \
                --target libatrinik-path libatrinik-rendezvous libatrinik-signals \
                  libatrinik-metaserver-publisher \
                  libatrinik-metaserver-url libatrinik-socket-address libatrinik-socket-quic \
                  libatrinik-stun \
                --parallel "$(nproc)"
              cd client
              bash tools/build-windows-package.sh build/windows-pr-package
              package=$(find build/windows-pr-package -maxdepth 1 -type f \
                -name "atrinik-classic-client-*-windows-x86_64.zip" -print)
              test -n "${package}"
              test "$(printf "%s\n" ${package} | wc -l)" -eq 1
              python3 -c "
          import sys, zipfile
          application_id = b\"123456789012345678\\n\"
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
              executable = next(name for name in names if name.endswith(\"/atrinik.exe\"))
              config = next(name for name in names if name.endswith(\"/data/discord-application-id\"))
              assert archive.read(config) == application_id
              assert b\"111111111111111111\" not in archive.read(config)
              assert application_id.strip() not in archive.read(executable)
          " "${package}"
              cd ..
              cmake \
                -DPATCH_EXECUTABLE="$(command -v patch)" \
                -DSOURCE_DIR=/workspace/build/libpcpnatpmp-mingw-source \
                -DPATCH_FILE=/workspace/server/cmake/patches/libpcpnatpmp-mingw.patch \
                -P /workspace/server/cmake/apply_patch_idempotent.cmake
              x86_64-w64-mingw32.shared-cmake \
                -S . \
                -B build/windows-integrated \
                -G Ninja \
                -DBUILD_TESTING=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_PYTHON_PLUGIN=OFF \
                -DPACKAGE_TYPE=none \
                -DFETCHCONTENT_SOURCE_DIR_LIBPCPNATPMP=/workspace/build/libpcpnatpmp-mingw-source
              cmake --build build/windows-integrated \
                --target atrinik atrinik-server --parallel "$(nproc)"
              stage=libatrinik/build/windows-test-bundle
              cmake -E remove_directory "${stage}"
              python3 tools/ci/stage_windows_runtime.py \
                --objdump x86_64-w64-mingw32.shared-objdump \
                --runtime-dir "${MXE_RUNTIME_DIR}" \
                --output-dir "${stage}" \
                libatrinik/build/windows-tests/libatrinik-path.exe \
                libatrinik/build/windows-tests/libatrinik-rendezvous.exe \
                libatrinik/build/windows-tests/libatrinik-signals.exe \
                libatrinik/build/windows-tests/libatrinik-metaserver-publisher.exe \
                libatrinik/build/windows-tests/libatrinik-metaserver-url.exe \
                libatrinik/build/windows-tests/libatrinik-socket-address.exe \
                libatrinik/build/windows-tests/libatrinik-socket-quic.exe \
                libatrinik/build/windows-tests/libatrinik-stun.exe \
                client/build/windows-release/client-rich-presence-tests.exe
              cmake -E copy_directory libatrinik/tests/fixtures "${stage}/fixtures"
              cmake -E copy tools/ci/smoke_windows_server_package.ps1 "${stage}"
            '
      - name: Cross-build Windows server
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/tmp/atrinik-server-ccache \
            --env CCACHE_TEMPDIR=/tmp/atrinik-server-ccache-tmp \
            --env CCACHE_MAXSIZE=250M \
            --env GH_TOKEN= \
            --env GITHUB_TOKEN= \
            --env PATH=/opt/mxe/.ccache/bin:/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            ghcr.io/atrinik/windows-build:1.2.1@sha256:d1f082eb28891600a9cf018a1d4310b9f3e1f985f82139fa48fbd4ac77b623bb \
            bash -c '
              set -euo pipefail
              x86_64-w64-mingw32.shared-cmake \
                -S server \
                -B server/build/windows-pr-server \
                -G Ninja \
                -DBUILD_TESTING=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_PYTHON_PLUGIN=OFF \
                -DPACKAGE_TYPE=none \
                -DPACKAGE_VERSION=0.0.0 \
                -DFETCHCONTENT_SOURCE_DIR_ATRINIK_PROTOCOL=/workspace/protocol \
                -DFETCHCONTENT_SOURCE_DIR_LIBATRINIK=/workspace/libatrinik \
                -DFETCHCONTENT_SOURCE_DIR_LIBPCPNATPMP=/workspace/build/libpcpnatpmp-mingw-source
              cmake --build server/build/windows-pr-server \
                --target atrinik-server --parallel "$(nproc)"
            '
      - name: Build portable Windows server package
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env ATRINIK_PACKAGE_VERSION=0.0.0 \
            --env ATRINIK_DEPENDENCY_DOWNLOADS=/workspace/build/dependency-inputs/downloads \
            --env ATRINIK_DEPENDENCY_CACHE_DIR=/workspace/build/dependency-source-cache \
            --env CCACHE_DIR=/workspace/server/build/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env CCACHE_TEMPDIR=/tmp/atrinik-server-package-ccache \
            --env PATH=/opt/mxe/.ccache/bin:/opt/mxe/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace/server \
            ghcr.io/atrinik/windows-build:1.2.1@sha256:d1f082eb28891600a9cf018a1d4310b9f3e1f985f82139fa48fbd4ac77b623bb \
            bash tools/build-windows-package.sh build/windows-pr-package
          cp server/build/windows-pr-package/*.zip \
            libatrinik/build/windows-test-bundle/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-windows-tests
          path: libatrinik/build/windows-test-bundle
          if-no-files-found: error
          retention-days: 1

  windows-test:
    name: Native Windows security tests
    needs:
      - changes
      - windows-test-build
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-windows-tests
          path: build/native-windows-tests
      - name: Execute private-state and protocol tests on Windows
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "build/native-windows-tests").Path
          $env:PATH = "${bundle};${env:PATH}"

          $junctionTarget = Join-Path $bundle "junction-target"
          $junction = Join-Path $bundle "junction"
          New-Item -ItemType Directory -Path $junctionTarget | Out-Null
          New-Item -ItemType Junction -Path $junction -Target $junctionTarget | Out-Null
          & (Join-Path $bundle "libatrinik-path.exe") $junction
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-path.exe failed with exit code ${LASTEXITCODE}"
          }

          $positive = Join-Path $bundle "fixtures/rendezvous-invite-v1.json"
          $negative = Join-Path $bundle "fixtures/rendezvous-invite-v1-negative.json"
          & (Join-Path $bundle "libatrinik-rendezvous.exe") $positive $negative
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-rendezvous.exe failed with exit code ${LASTEXITCODE}"
          }

          Push-Location $bundle
          $originalAppData = $env:APPDATA
          try {
            Remove-Item Env:APPDATA -ErrorAction SilentlyContinue
            Remove-Item -Force -ErrorAction SilentlyContinue `
              "libatrinik-signals-test-traceback-*.txt"
            $process = Start-Process `
              -FilePath (Join-Path $bundle "libatrinik-signals.exe") `
              -ArgumentList "--crash" -Wait -PassThru
            $exitCode = '{0:X8}' -f ($process.ExitCode -band 0xffffffffL)
            if ($exitCode -ne "C0000005") {
              throw "libatrinik-signals.exe exited with 0x${exitCode}"
            }
            $tracebacks = @(Get-ChildItem -File `
              -Filter "libatrinik-signals-test-traceback-*.txt")
            if ($tracebacks.Count -ne 1) {
              throw "Expected one traceback file, found $($tracebacks.Count)"
            }
            $traceback = Get-Content -Raw -LiteralPath $tracebacks[0].FullName
            if ([regex]::Matches($traceback, "(?m)^Error:").Count -ne 1) {
              throw "Expected exactly one traceback block"
            }
            foreach ($field in @(
              "Exception address:",
              "Exception code: 0xc0000005",
              "Access type: write (1)",
              "Fault address:",
              "Exception module base:",
              "Exception module name:",
              "Stack trace:"
            )) {
              if (-not $traceback.Contains($field)) {
                throw "Traceback is missing '$field'"
              }
            }
            if ($traceback -notmatch `
                '(?im)^Exception module name: .*libatrinik-signals\.exe\r?$') {
              throw "Traceback did not identify the crashing executable"
            }
            $orderedFields = @(
              "Exception code:",
              "Exception address:",
              "Access type:",
              "Fault address:",
              "Exception module base:",
              "Exception module name:",
              "Stack trace:"
            )
            $previousIndex = -1
            foreach ($field in $orderedFields) {
              $index = $traceback.IndexOf($field, [StringComparison]::Ordinal)
              if ($index -le $previousIndex) {
                throw "Traceback field '$field' is missing or out of order"
              }
              $previousIndex = $index
            }
            Remove-Item -Force -LiteralPath $tracebacks[0].FullName
          } finally {
            if ($null -eq $originalAppData) {
              Remove-Item Env:APPDATA -ErrorAction SilentlyContinue
            } else {
              $env:APPDATA = $originalAppData
            }
            Pop-Location
          }

          & (Join-Path $bundle "libatrinik-signals.exe") --handled-exception
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-signals.exe handled exception test failed with exit code ${LASTEXITCODE}"
          }

          & (Join-Path $bundle "libatrinik-signals.exe") --exception-guard
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-signals.exe exception guard test failed with exit code ${LASTEXITCODE}"
          }

          $publisher = Join-Path $bundle "fixtures/metaserver-publisher-v1.json"
          & (Join-Path $bundle "libatrinik-metaserver-publisher.exe") $publisher
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-metaserver-publisher.exe failed with exit code ${LASTEXITCODE}"
          }

          & (Join-Path $bundle "libatrinik-metaserver-url.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-metaserver-url.exe failed with exit code ${LASTEXITCODE}"
          }

          & (Join-Path $bundle "libatrinik-socket-address.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-socket-address.exe failed with exit code ${LASTEXITCODE}"
          }

          & (Join-Path $bundle "libatrinik-socket-quic.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-socket-quic.exe failed with exit code ${LASTEXITCODE}"
          }

          & (Join-Path $bundle "libatrinik-stun.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "libatrinik-stun.exe failed with exit code ${LASTEXITCODE}"
          }

          & (Join-Path $bundle "client-rich-presence-tests.exe")
          if ($LASTEXITCODE -ne 0) {
            throw "client-rich-presence-tests.exe failed with exit code ${LASTEXITCODE}"
          }

          $packages = @(Get-ChildItem -LiteralPath $bundle -File `
            -Filter "atrinik-classic-server-*-windows-x86_64.zip")
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Windows server package, found $($packages.Count)"
          }
          & (Join-Path $bundle "smoke_windows_server_package.ps1") `
            -Package $packages[0].FullName

  server:
    name: Server validation
    needs: [changes, dependency-inputs]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: classic-dependency-inputs
          path: build/dependency-inputs
      - id: linux-cache
        name: Resolve isolated server compiler cache key
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/linux_cache_key.py \
            --component server \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --pr-number "${PR_NUMBER}" \
            --commit "${GITHUB_SHA}" \
            --image-digest "${CLASSIC_LINUX_IMAGE_DIGEST}" \
            --compiler "${CLASSIC_LINUX_CCACHE_COMPILER}" \
            --epoch "${CLASSIC_LINUX_CCACHE_EPOCH}" \
            --material .github/workflows/check.yml \
            --material tools/ci/run_linux_check.sh \
            --material server/CMakeLists.txt \
            --material server/CMakePresets.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-ccache/server
          key: ${{ steps.linux-cache.outputs.key }}
          restore-keys: ${{ steps.linux-cache.outputs.restore_prefix }}
      - name: Pull pinned Classic Linux environment
        run: docker pull "${CLASSIC_LINUX_IMAGE}"
      - name: Prepare stable server compiler cache mount
        run: |
          mkdir -p "${RUNNER_TEMP}/classic-ccache/server"
          chmod 1777 "${RUNNER_TEMP}/classic-ccache/server"
      - name: Validate, build, and test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env HOME=/tmp/classic-home \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache/server:/cache/ccache" \
            --workdir /workspace \
            "${CLASSIC_LINUX_IMAGE}" \
            tools/ci/run_linux_check.sh server /workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-server-ccache-${{ github.run_attempt }}
          path: build/ci-evidence/ccache-server.tsv
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: server/coverage.xml
          flags: server
          use_oidc: true

  client:
    name: Client validation
    needs: [changes, dependency-inputs]
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 30 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: classic-dependency-inputs
          path: build/dependency-inputs
      - name: Initialize client benchmark evidence
        run: |
          mkdir -p build/ci-evidence
          printf '%s\n' \
            '{"schema_version":1,"skipped":true,"reason":"client-validation-ended-before-lighting-evidence"}' \
            >build/ci-evidence/lighting-frame-time.json
          python3 client/tools/benchmark_movement_regression.py error \
            --reason client-validation-ended-before-movement-evidence \
            --output build/ci-evidence/movement-frame-time.json
      - id: linux-cache
        name: Resolve isolated client compiler cache key
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/linux_cache_key.py \
            --component client \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --pr-number "${PR_NUMBER}" \
            --commit "${GITHUB_SHA}" \
            --image-digest "${CLASSIC_LINUX_IMAGE_DIGEST}" \
            --compiler "${CLASSIC_LINUX_CCACHE_COMPILER}" \
            --epoch "${CLASSIC_LINUX_CCACHE_EPOCH}" \
            --material .github/workflows/check.yml \
            --material tools/ci/run_linux_check.sh \
            --material client/tools/benchmark_lighting_regression.py \
            --material client/tools/benchmark_movement_regression.py \
            --material client/CMakeLists.txt \
            --material client/CMakePresets.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-ccache/client
          key: ${{ steps.linux-cache.outputs.key }}
          restore-keys: ${{ steps.linux-cache.outputs.restore_prefix }}
      - name: Pull pinned Classic Linux environment
        run: docker pull "${CLASSIC_LINUX_IMAGE}"
      - name: Prepare stable client compiler cache mount
        run: |
          mkdir -p "${RUNNER_TEMP}/classic-ccache/client"
          chmod 1777 "${RUNNER_TEMP}/classic-ccache/client"
      - name: Validate, build, and test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env HOME=/tmp/classic-home \
            --env CI \
            --env ImageOS \
            --env ImageVersion \
            --env RUNNER_ARCH \
            --env RUNNER_OS \
            --env ATRINIK_BENCHMARK_BASE_SHA="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}" \
            --env ATRINIK_BENCHMARK_REVISION="${GITHUB_SHA}" \
            --env ATRINIK_BENCHMARK_DIRTY=false \
            --env ATRINIK_MOVEMENT_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            --env ATRINIK_MOVEMENT_MATRIX="${{ github.event_name == 'workflow_dispatch' && 'full' || 'fast' }}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache/client:/cache/ccache" \
            --workdir /workspace \
            "${CLASSIC_LINUX_IMAGE}" \
            tools/ci/run_linux_check.sh client /workspace
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          disable_search: true
          fail_ci_if_error: false
          files: client/coverage.xml
          flags: client
          use_oidc: true
      - name: Render movement regression comment
        if: always()
        env:
          CLIENT_RESULT: ${{ job.status }}
        run: |
          python3 client/tools/benchmark_movement_regression.py render-comment \
            --input build/ci-evidence/movement-frame-time.json \
            --client-result "${CLIENT_RESULT}" \
            --baseline-schema build/ci-evidence/movement-baseline-schema.py \
            --output build/ci-evidence/movement-comment.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linux-client-evidence-${{ github.run_attempt }}
          path: build/ci-evidence
          if-no-files-found: error
          retention-days: 14

  movement-regression-comment:
    name: Movement regression summary
    needs: [changes, client]
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.changes.outputs.client == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download regression evidence
        id: evidence
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${GITHUB_RUN_ID}"
          --repo "${GITHUB_REPOSITORY}"
          --name "linux-client-evidence-${GITHUB_RUN_ATTEMPT}"
          --dir evidence
      - name: Publish one pre-rendered summary comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          CLIENT_RESULT: ${{ needs.client.result }}
        run: |
          marker='<!-- atrinik-movement-regression-summary -->'
          if test -f evidence/movement-comment.md &&
            test "$(head -n 1 evidence/movement-comment.md)" = "${marker}" &&
            test "$(wc -c <evidence/movement-comment.md)" -le 65536; then
            cp evidence/movement-comment.md comment.md
          else
            printf '%s\n' \
              "${marker}" \
              '## Movement regression summary' \
              '' \
              "Regression evidence is unavailable because client validation finished with \`${CLIENT_RESULT}\`." \
              >comment.md
          fi
          comment_id=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" |
            sed -n '1p')
          if test -n "${comment_id}"; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              --raw-field body="$(<comment.md)" >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --raw-field body="$(<comment.md)" >/dev/null
          fi

  integrated:
    name: Integrated client/server graph
    needs: [changes, dependency-inputs]
    if: >-
      needs.changes.outputs.client == 'true' ||
      needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: classic-dependency-inputs
          path: build/dependency-inputs
      - id: linux-cache
        name: Resolve isolated integrated compiler cache key
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 tools/ci/linux_cache_key.py \
            --component integrated \
            --event "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" \
            --pr-number "${PR_NUMBER}" \
            --commit "${GITHUB_SHA}" \
            --image-digest "${CLASSIC_LINUX_IMAGE_DIGEST}" \
            --compiler "${CLASSIC_LINUX_CCACHE_COMPILER}" \
            --epoch "${CLASSIC_LINUX_CCACHE_EPOCH}" \
            --material .github/workflows/check.yml \
            --material tools/ci/run_linux_check.sh \
            --material CMakeLists.txt \
            --material CMakePresets.json \
            --material protocol/CMakeLists.txt \
            --material libatrinik/CMakeLists.txt \
            --material client/CMakeLists.txt \
            --material server/CMakeLists.txt \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-ccache/integrated
          key: ${{ steps.linux-cache.outputs.key }}
          restore-keys: ${{ steps.linux-cache.outputs.restore_prefix }}
      - name: Pull pinned Classic Linux environment
        run: docker pull "${CLASSIC_LINUX_IMAGE}"
      - name: Prepare stable integrated compiler cache mount
        run: |
          mkdir -p "${RUNNER_TEMP}/classic-ccache/integrated"
          chmod 1777 "${RUNNER_TEMP}/classic-ccache/integrated"
      - name: Build shared Release graph
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env CCACHE_DIR=/cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env HOME=/tmp/classic-home \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache/integrated:/cache/ccache" \
            --workdir /workspace \
            "${CLASSIC_LINUX_IMAGE}" \
            tools/ci/run_linux_check.sh integrated /workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-integrated-ccache-${{ github.run_attempt }}
          path: build/ci-evidence/ccache-integrated.tsv
          if-no-files-found: error
          retention-days: 14

  classic-validation:
    name: Classic validation
    if: always()
    needs:
      - changes
      - dependency-inputs
      - core
      - server
      - client
      - integrated
      - windows-test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected component checks
        run: |
          python3 tools/ci/require_checks.py classic \
            --classifier-result '${{ needs.changes.result }}' \
            --dependency-inputs-result '${{ needs.dependency-inputs.result }}' \
            --core-result '${{ needs.core.result }}' \
            --client-required '${{ needs.changes.outputs.client }}' \
            --client-result '${{ needs.client.result }}' \
            --server-required '${{ needs.changes.outputs.server }}' \
            --server-result '${{ needs.server.result }}' \
            --integrated-required "${{ needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true' }}" \
            --integrated-result '${{ needs.integrated.result }}' \
            --windows-required '${{ needs.changes.outputs.windows }}' \
            --windows-result '${{ needs.windows-test.result }}'
