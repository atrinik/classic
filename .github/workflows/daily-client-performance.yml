name: Daily Classic client performance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      checkpoint_source:
        description: Source of the predecessor checkpoint
        type: choice
        options:
          - pages
          - final-benchmark-data
        default: pages
        required: true

permissions:
  contents: read

concurrency:
  group: classic-daily-client-performance
  cancel-in-progress: false

env:
  CLASSIC_LINUX_IMAGE: ghcr.io/atrinik/classic-build:1.2.3@sha256:d0ec0a31f97fa1d699f62b81bbe697d95b335f44f1c99fde8704dfc528e2102f
  CLASSIC_LINUX_IMAGE_DIGEST: sha256:d0ec0a31f97fa1d699f62b81bbe697d95b335f44f1c99fde8704dfc528e2102f
  CLASSIC_LINUX_CCACHE_COMPILER: gcc-15.2.0
  CLASSIC_LINUX_CCACHE_EPOCH: "1"
  FINAL_BENCHMARK_DATA_COMMIT: bab40ecefefa5b6052d42eab6390c504b9482e81
  PAGES_URL: https://atrinik.github.io/classic/

jobs:
  benchmark:
    name: Full movement and frozen-frame report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the benchmark to the triggering main commit
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p build/ci-evidence
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            '{repository: $repository, source_sha: $sha, run_id: $run_id,
              run_attempt: $run_attempt, workflow: $workflow}' \
            >build/ci-evidence/run-identity.json
      - id: dependency-key
        name: Resolve complete immutable input key
        run: |
          python3 server/tools/dependencies.py bundle-key \
            --client-lock client/dependencies.lock.json \
            --server-lock server/dependencies.lock.json \
            --source-lock server/cmake/immutable_sources.lock.json \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/classic-dependency-archives
          key: classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}
          restore-keys: >-
            classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}-
      - name: Recover attested unchanged dependency archives
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/classic-docker-config
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin
          bash tools/release/recover_attested_dependency_bundle.sh \
            "${RUNNER_TEMP}/classic-trusted-dependency-bundle"
      - id: dependency-stage
        name: Acquire and verify complete immutable input bundle
        run: |
          python3 server/tools/dependencies.py bundle-stage \
            --client-lock client/dependencies.lock.json \
            --server-lock server/dependencies.lock.json \
            --source-lock server/cmake/immutable_sources.lock.json \
            --cache "${RUNNER_TEMP}/classic-dependency-archives" \
            --trusted-bundle "${RUNNER_TEMP}/classic-trusted-dependency-bundle" \
            --output build/dependency-inputs \
            --github-output "${GITHUB_OUTPUT}"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/gpu-shader-downloads
          key: >-
            gpu-shader-inputs-v1-${{ hashFiles('client/shaders/toolchain.lock.json',
            'client/tools/prepare_gpu_shader_toolchain.py') }}
      - name: Compile the scheduled benchmark shader cohort
        run: >-
          tools/ci/prepare_gpu_shaders.sh
          "${GITHUB_WORKSPACE}"
          "${RUNNER_TEMP}/gpu-shader-downloads"
          "${GITHUB_WORKSPACE}/build/gpu-shaders"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.dependency-stage.outputs.cache_changed == 'true'
        with:
          path: ${{ runner.temp }}/classic-dependency-archives
          key: >-
            classic-dependency-archives-v1-${{ steps.dependency-key.outputs.digest }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare isolated compiler cache
        run: |
          mkdir -p "${RUNNER_TEMP}/classic-ccache"
          chmod 1777 "${RUNNER_TEMP}/classic-ccache"
      - id: benchmark
        name: Run the pinned complete client benchmark matrix
        env:
          ATRINIK_BENCHMARK_REVISION: ${{ github.sha }}
          ATRINIK_BENCHMARK_DIRTY: false
          ATRINIK_MOVEMENT_EVENT_NAME: schedule
          ATRINIK_MOVEMENT_MATRIX: full
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --env ATRINIK_BENCHMARK_REVISION \
            --env ATRINIK_BENCHMARK_DIRTY \
            --env ATRINIK_MOVEMENT_EVENT_NAME \
            --env ATRINIK_MOVEMENT_MATRIX \
            --env CCACHE_DIR=/cache/ccache \
            --env CCACHE_MAXSIZE=500M \
            --env HOME=/tmp/classic-home \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}/classic-ccache:/cache/ccache" \
            --workdir /workspace \
            "${CLASSIC_LINUX_IMAGE}" \
            tools/ci/run_linux_check.sh client-benchmark /workspace
      - id: evidence
        name: Require explicit movement evidence or preserve a diagnostic
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          if test -s build/ci-evidence/movement-frame-time.json; then
            echo 'present=true' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'present=false' >>"${GITHUB_OUTPUT}"
          # shellcheck disable=SC2016
          jq -n \
            --arg outcome "${BENCHMARK_OUTCOME}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{error: "movement-frame-time.json was not produced", benchmark_outcome: $outcome,
              source_sha: $sha, run_id: $run_id, run_attempt: $run_attempt}' \
            >build/ci-evidence/missing-movement-evidence.json
          {
            echo '## Classic client performance infrastructure failure'
            echo
            echo 'movement-frame-time.json was not produced. Inspect the attempt-qualified raw artifact.'
          } >>"${GITHUB_STEP_SUMMARY}"
          test "${BENCHMARK_OUTCOME}" != success
      - name: Publish job summary
        if: always() && steps.evidence.outputs.present == 'true'
        env:
          CLIENT_RESULT: ${{ steps.benchmark.outcome }}
        run: |
          python3 client/tools/benchmark_movement_regression.py render-comment \
            --input build/ci-evidence/movement-frame-time.json \
            --client-result "${CLIENT_RESULT}" \
            --output build/ci-evidence/benchmark-summary.md
          cat build/ci-evidence/benchmark-summary.md >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: daily-client-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence
          if-no-files-found: error
          retention-days: 90

  project:
    name: Validate and project the bounded static checkpoint
    needs: benchmark
    if: needs.benchmark.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind publication to the successful benchmark attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p build
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >build/run.json
          test "$(jq -r .head_sha build/run.json)" = "${GITHUB_SHA}"
          test "$(jq -r .head_branch build/run.json)" = main
          test "$(jq -r .event build/run.json)" = schedule -o \
            "$(jq -r .event build/run.json)" = workflow_dispatch
          test "$(jq -r .run_attempt build/run.json)" = "${GITHUB_RUN_ATTEMPT}"
          echo "RUN_RECORDED_AT=$(jq -r .created_at build/run.json)" >>"${GITHUB_ENV}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: daily-client-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-evidence
      - name: Load the exact predecessor checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKPOINT_SOURCE: ${{ inputs.checkpoint_source || 'pages' }}
        run: |
          if test "${CHECKPOINT_SOURCE}" = pages; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-client-performance.yml/runs?branch=main&status=success&per_page=20" \
              >build/successful-performance-runs.json
            # shellcheck disable=SC2016
            expected_run=$(jq -c '
              [.workflow_runs[] |
                select(.event == "schedule" or .event == "workflow_dispatch")][0] // empty
            ' build/successful-performance-runs.json)
            test -n "${expected_run}"
            python3 tools/ci/daily_performance_site.py fetch \
              --base-url "${PAGES_URL}" \
              --output build/performance-checkpoint
            test "$(jq -r .run_id build/performance-checkpoint/v1/manifest.json)" = \
              "$(jq -r .id <<<"${expected_run}")"
            test "$(jq -r .run_attempt build/performance-checkpoint/v1/manifest.json)" = \
              "$(jq -r .run_attempt <<<"${expected_run}")"
            test "$(jq -r .source_sha build/performance-checkpoint/v1/manifest.json)" = \
              "$(jq -r .head_sha <<<"${expected_run}")"
          elif test "${CHECKPOINT_SOURCE}" = final-benchmark-data && \
            test "${GITHUB_EVENT_NAME}" = workflow_dispatch; then
            git cat-file -e "${FINAL_BENCHMARK_DATA_COMMIT}^{commit}" || \
              git fetch origin "${FINAL_BENCHMARK_DATA_COMMIT}"
            mkdir -p build/performance-legacy
            git archive "${FINAL_BENCHMARK_DATA_COMMIT}" | \
              tar -x -C build/performance-legacy
          else
            echo "invalid checkpoint source: ${CHECKPOINT_SOURCE}" >&2
            exit 2
          fi
      - name: Build and validate the complete static deployment
        env:
          CHECKPOINT_SOURCE: ${{ inputs.checkpoint_source || 'pages' }}
        run: |
          # shellcheck disable=SC2016
          environment=$(jq -cn \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg artifact_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts" \
            --arg runner_image "${ImageOS:-ubuntu24}" \
            '{repository: $repository, workflow_url: $workflow_url,
              artifact_url: $artifact_url, runner_image: $runner_image}')
          source_arguments=(--checkpoint build/performance-checkpoint)
          if test "${CHECKPOINT_SOURCE}" = final-benchmark-data; then
            source_arguments=(
              --legacy-checkpoint build/performance-legacy
              --legacy-final-ref "${FINAL_BENCHMARK_DATA_COMMIT}"
            )
          fi
          python3 tools/ci/daily_performance_site.py build \
            --evidence build/ci-evidence/movement-frame-time.json \
            --output build/performance-site \
            --commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --recorded-at "${RUN_RECORDED_AT}" \
            --environment "${environment}" \
            --summary build/ci-evidence/site-summary.md \
            "${source_arguments[@]}"
          python3 tools/ci/daily_performance_site.py validate \
            --site build/performance-site
          cat build/ci-evidence/site-summary.md >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daily-client-performance-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/performance-site/v1/alerts.json
            build/performance-site/v1/manifest.json
            build/performance-site/v1/state.json
            build/performance-site/points/run-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/performance-site

  deploy:
    name: Deploy the validated performance site
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy the immutable Pages artifact
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alerts:
    name: Reconcile deployed regression alert state
    needs: [project, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: daily-client-performance-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/performance-checkpoint-artifact
      - name: Reconcile complete desired alert state once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/daily_performance_site.py validate-artifact \
            --artifact build/performance-checkpoint-artifact
          python3 tools/ci/reconcile_performance_alerts.py \
            --alerts build/performance-checkpoint-artifact/v1/alerts.json \
            --workflow-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
