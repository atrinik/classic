name: Recover Missing Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag whose GitHub release is missing
        required: true
        type: string
      source_branch:
        description: Release branch that owns the tag
        required: false
        default: main
        type: string

permissions:
  actions: write
  checks: read
  contents: write

concurrency:
  group: classic-release-publication
  cancel-in-progress: false

jobs:
  recover:
    name: Recover missing GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a supported source branch and workflow definition
        env:
          RELEASE_SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
        run: |
          [[ ${RELEASE_SOURCE_BRANCH} == main || ${RELEASE_SOURCE_BRANCH} =~ ^[0-9]+\.[0-9]+\.x$ ]]
          test "${GITHUB_REF}" = "refs/heads/${RELEASE_SOURCE_BRANCH}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - id: recovery
        name: Prove the exact recoverable state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_BRANCH: ${{ inputs.source_branch || 'main' }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release/recover_release.py \
            --tag "${RELEASE_TAG}" \
            --repository "${RELEASE_REPOSITORY}" \
            --source-branch "${RELEASE_SOURCE_BRANCH}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Create release notes for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npx --yes \
            --package=semantic-release@25.0.9 \
            --package=@semantic-release/commit-analyzer@13.0.1 \
            --package=@semantic-release/release-notes-generator@14.1.1 \
            --package=@semantic-release/exec@7.1.0 \
            --package=conventional-changelog-conventionalcommits@9.3.1 \
            node tools/release/generate_release_notes.mjs \
              --tag "${RELEASE_TAG}" \
              --previous-tag '${{ steps.recovery.outputs.previous_tag }}' \
              --repository-url "https://github.com/${RELEASE_REPOSITORY}.git" \
              --output build/release-notes.md
          gh release create "${RELEASE_TAG}" \
            --draft \
            --notes-file build/release-notes.md \
            --title "Atrinik Classic ${RELEASE_TAG}" \
            --verify-tag
      - name: Queue packaging from the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ATRINIK_RELEASE_BRANCH: ${{ inputs.source_branch || 'main' }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: tools/release/queue_package_release.sh "${RELEASE_TAG#v}"
